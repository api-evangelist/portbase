      http_status: 200
      fetched: '2026-10-18'
      quote: '11.2 If the Client is of the opinion that the Services contain unlawful, illegal or otherwise harmful content then the Client will contact Portbase as soon as possible at the email address security@portbase.com. The Client’s notification must in all cases include a brief reason for the notification of and the exact location of the allegedly unlawful or illegal content.'
    - source: https://www.portbase.com/wp-content/uploads/2025/02/General-Terms-and-Conditions-of-Portbase-1.pdf
      http_status: 200
      fetched: '2026-10-18'
      quote: '11.3 Portbase will then make a decision about the Client’s notification and will endeavour to inform the Client of this decision within 10 (ten) Working Days. 11.4 If the Client does not agree with the decision Portbase makes about the notification then he can file an objection with the Legal department at the e-mail address legal@portbase.com.'
    note: A DSA-style notice-and-action mechanism in the GTC (version dated 11 February 2025), with a notice channel, required notice contents, a target decision time and an internal objection route.
