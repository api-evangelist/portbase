      quote: 'Via our contact form you can, as a data subject: – Make a written request to inspect, amend and delete personal data. – Request or invoke the right to data portability. This is the right to transfer data, either to yourself or to another organisation providing the same services.'
    - source: https://www.portbase.com/en/privacy-statement/
      http_status: 200
      fetched: '2026-10-18'
      quote: 'Portbase hereby requests justification of your request as well as identification. Within the statutory period of one (1) month, Portbase will comply with the request or inform you as a data subject of the status of the request or appeal.'
    - source: https://www.portbase.com/en/privacy-statement/
      http_status: 200
      fetched: '2026-10-18'
      quote: 'If, as a data subject, you are dissatisfied with the way Portbase has dealt with your request or in any other way with Portbase’s processing of your personal data, please file a complaint about the use of the personal data with the Data Protection Authority.'
