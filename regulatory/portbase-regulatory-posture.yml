    evidence:
    - source: https://www.portbase.com/en/privacy-statement/
      http_status: 200
      fetched: '2026-10-18'
      quote: 'Portbase retains most personal data for up to seven (7) years after the end of the business relationship as a client. Personal data of main administrators and/or users in IAMconnected are deleted within three (3) months after the end of the account, e.g. after a period of inactivity or exit from the organisation to which your account is linked.'
    - source: https://www.portbase.com/en/privacy-statement/
      http_status: 200
      fetched: '2026-10-18'
      quote: 'Identity document data or any copy thereof will be deleted within two (2) months after the identification required for registration of the account in IAMconnected.'
    note: Concrete retention periods are published — 7 years after the client relationship ends for most personal data, 3 months after account end for IAMconnected users, 2 months for identity-document data.
