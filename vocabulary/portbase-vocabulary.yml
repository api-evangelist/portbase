  - term: Operator API - handlings
    definition: API for the declarant to create, update, move, detach or cancel attached handlings (handlings that are connected to a visit and
      voyage).
    tags:
    - Resource Group
    source: openapi/portbase-hinterland-container-notification-openapi.yml
  - term: Operator API - visits
    definition: Endpoint to create new visits by a declarant, update, move or cancel them. A special operation to indicate the load-discharge
      list is finalized is also available, to let the terminal know that after reopening the load-discharge list after cut-off time, you are done
      with adding/removing handlings.
    tags:
    - Resource Group
    source: openapi/portbase-hinterland-container-notification-openapi.yml
  - term: Operator API - voyages
    definition: API for the declarant to create new voyages, update or cancel them. Special operations are also available to indicate that the
      voyage contains visits where restrictions apply (i.e. due to reefers).
    tags:
    - Resource Group
    source: openapi/portbase-hinterland-container-notification-openapi.yml
  - term: Organisation Data API
    definition: Api defining the operations a terminal/barge operator can do to retrieve organisation configuration. Basically these operations
      retrieve configuration data such as bollards, fixedwindows etc.
    tags:
    - Resource Group
    source: openapi/portbase-hinterland-container-notification-openapi.yml
  - term: Reference Data API
    definition: Portbase uses reference data within the API calls for instance barges, shipping companies, container sizetypes etc. With this
      Reference Data API you can retrieve the data to be used in the API calls for voyages, visits and handlings. This way you make sure you do
      not send unknown or invalid information.
    tags:
    - Resource Group
    source: openapi/portbase-hinterland-container-notification-openapi.yml
  - term: Terminal API - handlings
    definition: Api defining the operations a terminal can do for handlings. Basically these operations supply feedback to the declarant about
      the status of the handling.
    tags:
    - Resource Group
    source: openapi/portbase-hinterland-container-notification-openapi.yml
  - term: Terminal API - visits
    definition: Api defining the operations a terminal can do to respond on visit requests from the declarant. The terminal supplies feedback
