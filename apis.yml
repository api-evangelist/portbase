aid: portbase

name: Portbase

description: Portbase is the Port Community System (PCS) organisation of the Port of Rotterdam Authority and the Port of Amsterdam, digitally
  connecting the Dutch port community - terminals, shipping companies, transporters, forwarders and government - so that goods and data flows
  through the Dutch ports and connected chains run efficiently, sustainably and securely. It offers web services and system interfaces (APIs,
  AS2, sFTP, SMTP and webhooks) for services such as Cargo Controller Import/Export, notifications and cargo declarations, documented in its support
  centre.

