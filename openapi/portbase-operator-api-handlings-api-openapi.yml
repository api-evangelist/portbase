openapi: 3.2.0
info:
  title: Portbase Operator API - handlings API
  version: '2.0'
  contact:
    name: Portbase hinterland team
    url: https://hcn.pcs.portbase.com
    email: hinterland@portbase.com
  x-logo:
    url: Portbase_WB_RGB.png
    altText: Portbase logo
  description: 'Operations tagged Operator API - handlings across 2 of this provider''s published API definitions: portbase-hinterland-container-notification-v2.json, portbase-hinterland-container-notification-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.portbase.com/hcn
  description: Production server
- url: https://api.kt.portbase.com/hcn
  description: Test server
tags:
- name: Operator API - handlings
  description: API for the declarant to create, update, move, detach or cancel attached handlings (handlings that are connected to a visit and voyage).
paths:
  /attachedHandlings:create:
    post:
      tags:
      - Operator API - handlings
      summary: Create handling
      description: This endpoint can be used to create a handling attached to a barge, rail or road visit.
      operationId: _01_createAttachedHandling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHandling'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateHandlingResult'
        '403':
          description: operation unsuccessful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalCommandException'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /attachedHandlings:update:
    post:
      tags:
      - Operator API - handlings
      summary: Update handling
      description: This endpoint can be used to update a handling attached to a barge, rail or road visit.
      operationId: _02_updateAttachedHandling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHandling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /attachedHandlings:detach:
    post:
      tags:
      - Operator API - handlings
      summary: Detach handling
      description: This endpoint can be used to detach a handling from one of your barge, rail or road visits.
      operationId: _03_detach
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetachHandling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /handlings:cancel:
    post:
      tags:
      - Operator API - handlings
      summary: Cancel any handling
      description: This endpoint can be used to cancel any handling. Cancelling an attached handling will also detach the handling from the visit.
      operationId: _04_cancelAnyHandling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAndDetachHandling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /handlings:move:
    post:
      tags:
      - Operator API - handlings
      summary: Move any handling
      description: This endpoint can be used to move any handling to another one of your barge, rail or road visits.
      operationId: _05_move
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveHandling'
      responses:
        '204':
          description: successful operation
        '403':
          description: operation unsuccessful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalCommandException'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /detachedHandlings:create:
    post:
      tags:
      - Operator API - handlings
      summary: Create detached handling
      description: This endpoint can be used to create a handling which is not attached to a visit.
      operationId: _11_createDetachedHandling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDetachedHandling'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateHandlingResult'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /detachedHandlings:update:
    post:
      tags:
      - Operator API - handlings
      summary: Update detached handling
      description: This endpoint can be used to update a handling which is not attached to a visit.
      operationId: _12_updateDetachedHandling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDetachedHandling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /detachedHandlings:get:
    post:
      tags:
      - Operator API - handlings
      summary: Get detached handling
      description: This endpoint can be used to get a detached handling. Does not return voyages.
      operationId: _13_getDetachedHandlings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDetachedHandling'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetachedHandling'
        '204':
          description: no detached handlings found
        '403':
          description: operation unsuccessful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalCommandException'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /attachedHandlings:cancel:
    post:
      tags:
      - Operator API - handlings
      summary: Cancel handling
      description: This endpoint can be used to cancel a handling which is attached to a visit. Replaced by Cancel any handling.
      operationId: _14_cancelAttachedHandling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAndDetachHandling'
      responses:
        '204':
          description: successful operation
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /detachedHandlings:cancel:
    post:
      tags:
      - Operator API - handlings
      summary: Cancel detached handling
      description: This endpoint can be used to cancel a handling which is not attached to a visit. Replaced by Cancel any handling.
      operationId: _15_cancelDetachedHandling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDetachedHandling'
      responses:
        '204':
          description: successful operation
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /attachedHandlings:move:
    post:
      tags:
      - Operator API - handlings
      summary: Move handling
      description: This endpoint can be used to move an attached handling to another one of your barge, rail or road visits. Replaced by Move any handling.
      operationId: _16_move
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveHandling'
      responses:
        '204':
          description: successful operation
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /detachedHandlings:attach:
    post:
      tags:
      - Operator API - handlings
      summary: Attach detached handling
      description: This endpoint can be used to attach a detached handling to one of your barge, rail or road visits. Replaced by Update handling.
      operationId: _17_attach
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachHandling'
      responses:
        '204':
          description: successful operation
        '403':
          description: operation unsuccessful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalCommandException'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
components:
  schemas:
    UpdateDetachedHandling:
      required:
      - handlingData
      - handlingId
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
          example: d7727b42-b7d3-490e-aa70-619d7717b1d1
        terminal:
          title: ''
          type:
          - ''
          - 'null'
          description: The terminal location at which the container will be loaded or discharged.<br>Terminal must support the given modality.<br>Please refer to Reference Data API '[Get terminals](#operation/_08_getTerminals)' to get a list of known Terminals and its attributes.<br>Only one subfield is required.
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/GetTerminal'
        handlingData:
          allOf:
          - $ref: '#/components/schemas/HandlingData'
        eta:
          type:
          - string
          - 'null'
          description: The expected time of arrival of the means of hinterland's transport at the terminal.
          format: date-time
    Shipment:
      required:
      - data
      - goods
      - id
      - movements
      type: object
      properties:
        id:
          type: string
          description: The id of this shipment
        data:
          title: ''
          type: ''
          description: The shipment data as reported by the forwarder
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/ShipmentData'
        movements:
          type: array
          description: One or more movements to transport this shipment from origin to destination
          items:
            $ref: '#/components/schemas/CargoMovement'
        goods:
          type: array
          description: The shipped goods
          items:
            $ref: '#/components/schemas/ContainedGood'
        forwarders:
          type: array
          description: Organisations that have delegated the inland transport to another inland operator (or forwarder)
          items:
            $ref: '#/components/schemas/HinterlandOrganisation'
        releaseToParty:
          title: ''
          type:
          - ''
          - 'null'
          description: Party that will receive the commercial release.
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/HinterlandOrganisation'
        cargoWeight:
          type:
          - number
          - 'null'
        currentReleaseToPartyFullName:
          type:
          - string
          - 'null'
      description: A shipment of goods from origin to destination. A shipment is unique identified by a combination of B/L number and equipment number. Shipments are typically created by the shipper (consignor) or forwarder responsible for the cargo.
    CreateHandling:
      required:
      - handlingData
      - preNotification
      - visitId
      type: object
      properties:
        visitId:
          type: string
          description: Unique identifier of the visit which was generated on the creation of the visit
          example: '75111204'
        handlingData:
          allOf:
          - $ref: '#/components/schemas/HandlingData'
        preNotification:
          type: boolean
          description: Indication whether a pre-announcement (true) or a status request (when supported by the terminal for the given modality) must be send to the terminal (false). Status request on a visit not supported for Road.
    HandlingData:
      required:
      - bookingNumber
      - full
      - modality
      - shippingCompany
      - sizeType
      - type
      type: object
      properties:
        equipmentNumber:
          maxLength: 11
          minLength: 0
          type:
          - string
          - 'null'
          description: Required except for loading empty and depending on terminal setting `lossenOpRichtlijnAllowed`. <br>Unique identifier of the container.
          example: BICU1234565
        weight:
          maximum: 99999
          minimum: 0
          type:
          - number
          - 'null'
          description: Required depending on terminal setting. <br>The weight of the cargo in kilograms meaning the tare weight of the container excluded.
        tareWeight:
          maximum: 99999
          minimum: 0
          type:
          - number
          - 'null'
          description: The weight of the container itself in kilograms without the weight of the cargo.
        sealNumber:
          type:
          - string
          - 'null'
          description: Required depending on terminal setting and max length depending on terminal. <br>The identification number of the container seal.
        reefer:
          allOf:
          - $ref: '#/components/schemas/Reefer'
        outOfGauge:
          allOf:
          - $ref: '#/components/schemas/OutOfGauge'
        bookingNumber:
          maxLength: 35
          minLength: 0
          type: string
          description: The delivery ref for discharge or the release reference (pin code) for loading of the container at the terminal.
        shippingCompany:
          allOf:
          - $ref: '#/components/schemas/ShippingCompany'
        sizeType:
          allOf:
          - $ref: '#/components/schemas/SizeType'
        type:
          type: string
          description: Indication whether the container is loaded onto or unloaded from the hinterland means of transport.
          enum:
          - loading
          - discharge
        full:
          type: boolean
          description: Indication whether the container is full or empty.
        shippersOwned:
          type: boolean
          description: Indication whether the container identifier is a ISO 6346 compliant container number (apply true when it does not comply).
        humidity:
          type:
          - number
          - 'null'
          description: '`Integral planning` The humidity for this container in percentage.'
        doorOpen:
          type:
          - boolean
          - 'null'
          description: '`Integral planning` Indicates whether the door for this container is open.'
        chainWork:
          type:
          - boolean
          - 'null'
          description: '`Integral planning` Indicates whether chains are needed to load or discharge this container.'
        generator:
          type:
          - boolean
          - 'null'
          description: '`Integral planning` Indicates whether this container has a generator.'
        damageRemark:
          type:
          - string
          - 'null'
          description: '`Integral planning` Can be used to communicate detected damage to the container.'
        previousPort:
          type:
          - string
          - 'null'
          description: '`Integral planning` The code of the port this container departed from before arriving at Rotterdam.'
        remarks:
          type:
          - string
          - 'null'
          description: Remarks regarding this container.
          example: Connected reefer
        category:
          type:
          - string
          - 'null'
          description: '`Integral planning` The category of the container, free text, for example ‘food grade’.'
        nextPort:
          type:
          - string
          - 'null'
          description: '`Integral planning` The code of the port this container will be shipped to after departing from Rotterdam. Only for export containers (discharging).'
        finalPort:
          type:
          - string
          - 'null'
          description: '`Integral planning` The code of the port which is the final destination for this container, after departing from Rotterdam. Only for export containers (discharging).'
        dangerousGoods:
          type: array
          description: The specification of dangerous goods in this container
          items:
            $ref: '#/components/schemas/DangerousGood'
        consignmentNumber:
          type:
          - string
          - 'null'
          description: The unique transport document number from the Bill of Lading, used to identify and associate this container with its corresponding shipment
        totalContainerWeight:
          type:
          - number
          - 'null'
          description: The total weight of the container, meaning the 'weight' and the 'tareWeight' added.
        modality:
          type: string
          description: The way in which the transportation of the cargo takes place in the hinterland.
          example: barge
          enum:
          - road
          - rail
          - barge
          - cer
          - sea
        deepSea:
          allOf:
          - $ref: '#/components/schemas/DeepSeaReference'
      description: 'Cargo handling details as requested by the declarant for the given modality. '
      discriminator:
        propertyName: modality
        mapping:
          barge: '#/components/schemas/BargeHandlingData'
          road: '#/components/schemas/RoadHandlingData'
          rail: '#/components/schemas/RailHandlingData'
    TerminalRejectReason:
      required:
      - parsedReason
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: The error code sent by the terminal
        terminalDescription:
          type:
          - string
          - 'null'
          description: The error description sent by the terminal
        parsedReason:
          type: string
          description: A user friendly description of the error code
    ContainerGoodData:
      required:
      - hazardClass
      - unCode
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name of the container good
          example: PENTAERYTHRIETTETRANITRAAT (PENTAERYTHRITOLTETRANITRAAT, PETN), BEVOCHTIGD met ten minste 25 massa-% water of GEDESENSIBILISEERD, met ten minst 15 massa-% flegmatiseermiddel
        unCode:
          type: string
          description: The UN code of the container good
          example: '150'
        hazardClass:
          type: string
          description: The IMO hazard class of the container good
          example: '1'
        subsidiaryRisk:
          type:
          - string
          - 'null'
          description: Any risks in addition to the class to which dangerous goods are assigned; and which is determined by a requirement to have a subsidiary risk.
        emsFireCode:
          type:
          - string
          - 'null'
          description: The code of the emergency response procedure for vessels carrying dangerous goods in case of fire
        emsSpillageCode:
          type:
          - string
          - 'null'
          description: The code of the emergency response procedures for vessels carrying dangerous goods in case of spillage
        properties:
          type:
          - string
          - 'null'
          description: Extra information about the container good
        segregationGroup:
          type:
          - string
          - 'null'
          description: The segregation group of the container good
        packingGroup:
          type:
          - string
          - 'null'
          description: Indication of the level of danger
          enum:
          - MINOR_DANGER
          - MEDIUM_DANGER
          - GREAT_DANGER
        flashPoint:
          type:
          - number
          - 'null'
          description: The temperature in degrees Celsius at which a good will give off enough flammable vapour to be ignited. According IMDG Code DG Class 3 or subsidiary risk of Class 3
      description: Container good information as provided by the terminal
    AttachHandling:
      required:
      - handlingId
      - nextVisitId
      - nextVoyageId
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
          example: d7727b42-b7d3-490e-aa70-619d7717b1d1
        nextVisitId:
          type: string
          description: Unique identification of the visit to which the cargo handling must move.
        nextVoyageId:
          type: string
          description: Unique identification of the voyage related to the visit to which the cargo handling must move.
        preNotification:
          type: boolean
          description: Indication whether a pre-announcement (true) or a status request (when supported by the terminal for the given modality) must be send to the terminal (false). Status request on a visit not supported for Road.
    HandlingWindow:
      required:
      - end
      - start
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: For loading this constitutes the commercial release window, for discharge the cargo opening/closing.
    CancelDetachedHandling:
      required:
      - handlingId
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
          example: d7727b42-b7d3-490e-aa70-619d7717b1d1
        cancelReason:
          type:
          - string
          - 'null'
    HinterlandOrganisation:
      required:
      - fullName
      - shortName
      type: object
      properties:
        fullName:
          type: string
          description: The full name of the organisation
        shortName:
          type: string
          description: The short name of the organisation
        emailAddress:
          type:
          - string
          - 'null'
          description: The email address of the organisation
        address:
          type:
          - string
          - 'null'
          description: The address of the organisation
        city:
          type:
          - string
          - 'null'
          description: The city where the organisation is located
        countryUnCode:
          type:
          - string
          - 'null'
          description: The UN code of the country where the organisation is located
        countryName:
          type:
          - string
          - 'null'
          description: The name of the country where the organisation is located
        zipCode:
          type:
          - string
          - 'null'
          description: The zip code of the organisation
        phoneNumber:
          type:
          - string
          - 'null'
          description: The phone number of the organisation
        faxNumber:
          type:
          - string
          - 'null'
          description: The fax number of the organisation
        contact:
          type:
          - string
          - 'null'
          description: The contact person of the organisation
        customsEORINumber:
          type:
          - string
          - 'null'
          description: The EORI number of the organisation, issued by customs
        ean:
          type:
          - string
          - 'null'
          description: The EAN code of the organisation
        chamberOfCommerceNumber:
          type:
          - string
          - 'null'
          description: The chamber of commerce number of the organisation
        scacCode:
          type:
          - string
          - 'null'
          description: The SCAC code of the organisation
      description: Party that will receive the commercial release.
    Terminal:
      required:
      - allowedModalities
      - bicsCode
      - location
      - quayName
      - shortName
      - terminalSettings
      type: object
      properties:
        shortName:
          type: string
          description: Code issued by Portbase to identify the Terminal organisation.
        ean:
          type:
          - string
          - 'null'
          description: European Article Numbering issued by Secure Logistics to identify the Terminal organisation.
        bicsCode:
          type: string
          description: Terminal code according to the Terminal code table of Binnenvaart Informatie- en Communicatie Systeem managed by Rijkswaterstaat.
          example: 00DDE
        quayName:
          type: string
          description: The name of the quay where a vessel can moor for loading, unloading or e.g. awaiting orders.
          example: DDE
        smdgCode:
          type:
          - string
          - 'null'
          description: Terminal facility code according to the Shipplanning Message Development Group.
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
        displayNameOverrides:
          title: ''
          type: ''
          description: Quay name override per modality
          deprecated: false
          allOf:
          - type: object
            additionalProperties:
              type:
              - string
              - 'null'
              description: Quay name override per modality
            description: Quay name override per modality
        requiredDataAuthorisations:
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - deepSeaEta
            - cargoOpening
            - expectedDischargeTime
        allowedModalities:
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        tarRequired:
          type: boolean
          description: Only relevant for road. Indicates whether the terminal uses TAR codes or not.
        roadStatusRequestAllowed:
          type: boolean
          description: Only relevant for road. Indicates whether the terminal can process road status requests.
        bargeStatusRequestForbidden:
          type: boolean
          description: Only relevant for barge. Indicates whether the terminal can process barge status requests. Default is false.
        cutoffPeriod:
          type:
          - string
          - 'null'
          description: Only relevant for rail. Indicates the cutoff period for the train composition upload (relative to the eta) for this terminal.
          format: duration
        loadDischargeListSettings:
          allOf:
          - $ref: '#/components/schemas/LoadDischargeListSettings'
        quaySelectByDeclarantForbidden:
          type: boolean
          description: Indicates whether the terminal can be used by the Declarant to send a visit declaration. Some terminals can only be selected by the terminal organisation or Nextlogic, if so this option is set to true.
        updateAllowed:
          type: boolean
          description: Indicates whether the terminal allows updates on pre-notifications, only for *barge*. Status requests can always be updated. Deprecated, use the handlingUpdateForbidden setting to see for which modality updates are forbidden
          deprecated: true
        handlingUpdateForbidden:
          type: array
          description: Indicates whether the terminal does not support updates on pre-notifications. When this list contains a modality, updates are not supported for this terminal for that modality only. Status requests can always be updated.
          items:
            type:
            - string
            - 'null'
            description: Indicates whether the terminal does not support updates on pre-notifications. When this list contains a modality, updates are not supported for this terminal for that modality only. Status requests can always be updated.
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        handlingUpdateBypassAllowed:
          type: array
          description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass whereby a handling is first cancelled at the terminal and then declared as a new pre-notification.
          items:
            type:
            - string
            - 'null'
