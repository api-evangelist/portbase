openapi: 3.2.0
info:
  title: Portbase Tracking API
  x-logo:
    url: Portbase_WB_RGB.png
    altText: Portbase logo
  version: '1.0'
  description: 'Operations tagged Tracking API across 4 of this provider''s published API definitions: portbase-hinterland-container-notification-v2.json, portbase-portvisit-v6.json, portbase-hinterland-container-notification-openapi.yml, portbase-vessel-visit-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.portbase.com/hcn
  description: Production server
- url: https://api.kt.portbase.com/hcn
  description: Test server
- url: https://api.portbase.com/portvisit
  description: Production server
- url: https://api.kt.portbase.com/portvisit
  description: Acceptance server
- url: https://api.sc.portbase.com/portvisit
  description: Test server
tags:
- name: Tracking API
  description: 'This API can be used to receive **real-time** updates about the voyages, visits and (detached) handlings. To achieve these real-time updates the API uses a mechanism called ''long polling''. When you send a request to listen for updates, you will receive an update immediately when it happened since your last request. Or when there is no update, it will wait until there is, or timeout when the maxTimeout you specified is reached. After the api response has returned, and your client has finished processing the updates, you should always update your position. This way the next time you ask for updates, the API will look for updates after that position in the event log. This mechanism also enables batching, since you will receive all updates as fast as you can process them. Important to realize is that you will receive updates with a _before_ and _after_ situation in which only the changes are incorporated. So when only one handling is changed, you will receive only that handling within the visit within the voyage and not all containers and visits! The same per-item delta applies to the `trainLocationReports` on a rail voyage: each update contains only the reports that were added or changed, not the reports you already received in earlier updates. ## Usage

    Using the Tracking API should be a continuous process, running 24/7, looping through the following sequence of API calls

    1. Call `/listen`

    2. Process the updates that were returned

    3. Immediately after 2., call `/updatePosition` when done with your updates (even if the `/listen` response was empty, the index was null etc.)

    4. Keep repeating step 1-3

    5. When your process needs to stop, restart or redeploy, call `/disconnectClient`


    **Important:**

    - Implement this as a continuous loop where `/listen` is called immediately after `/updatePosition`. Do not use scheduled tasks (cron jobs), as this causes updates to accumulate faster than they can be processed, preventing real-time tracking. - Keep the timeout as high as possible (we recommend the default of 95000 ms). Results are returned immediately when available, but a higher timeout reduces connection overhead when updates are less frequent. Disconnecting the client makes sure that other connecting clients will receive the updates that were meant for this client. That is because you can connect multiple clients and each client is assigned a segment (range). Updates for a voyage will always be handled by the same segment. So when you do not disconnect your client, the other connected clients will not receive the updates for your segment(s) for a while. After a while when a client does not ask for updates, those segments are released to the other client(s). ## Things to consider when receiving updates

    In some situations you may receive multiple updates for one logical change. This happens when the change involves two voyages or a voyage and a detached handling. The order in which the updates for the different entities are received is not guaranteed. This may pose a challenge, depending on the structure of the data model used on the client side. The following sections describe the situations where this can occur and how to mitigate challenges caused by out-of-order updates. ### 1. A handling was attached

    Attaching a detached handling to a visit or voyage will result in two updates:

    - The detached handling will be marked as attached (`attached=true`)

    - The handling will appear as a new item in the array of handlings of the visit. If your data model only has a single copy of a handling (i.e. it does not store attached and detached handlings separately), then ignore the update of the detached handling and only process the update of the visit the handling was attached to. Subsequent updates of the handling will appear on the now attached handling on the visit. ### 2.'
paths:
  /listen:
    post:
      tags:
      - Tracking API
      summary: Listen to voyage and detachedHandling updates
      description: 'Listen in real-time to voyage and detachedHandling updates.


        Read the above section describing working of the Tracking API carefully.'
      operationId: _01_listen
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetHinterlandUpdates'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HinterlandUpdateBatch'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /updatePosition:
    post:
      tags:
      - Tracking API
      summary: Update position
      description: 'The `/updatePosition` endpoint lets us know which messages have been successfully processed by the client.


        The purpose of the endpoint is to protect against losing messages when client processing fails.

        The endpoint should be called after every `/listen` call. If the position is not updated after a `/listen` call, the same messages will be sent again in the next `/listen` call.


        **Note** You should always send the lastIndex of the batch, not the index of the last update in the batch.


        **Note** This endpoint should not be used to reset a client''s tracking position to some point in the past. Use `/resetPosition` for that.


        See /listen for more information.'
      operationId: _03_updatePosition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePosition'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /resetPosition:
    post:
      tags:
      - Tracking API
      summary: Reset position
      description: 'Clients can reset their tracking index to any point in the future and at most one week in the past using this endpoint.


        Either index or timestamp is required. If both index and timestamp are present, index will be used and timestamp ignored.


        **Note** Resetting the position influences all your connected clients!'
      operationId: _04_resetPosition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPosition'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /disconnectClient:
    post:
      tags:
      - Tracking API
      summary: Disconnects client
      description: 'When your polling client goes down, due to redeployment or to processing errors, you should call this api.

        This endpoint disconnects a client immediately, releasing the segments allocated to the client, to be allocated to the remaining active clients.


        When you take a client offline, and do not call `/disconnectClient`,

        the messages in the segment of the offline client will not be received by the remaining clients for a few minutes.

        If you reuse clientIds when redeploying, and have not disconnected the old clientId first, you might not be able to poll successfully for some time.'
      operationId: _05_disconnectClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisconnectClient'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /listen/shipments:
    post:
      tags:
      - Tracking API
      summary: Listen to shipment updates
      description: 'Listen in real-time to shipment updates.


        In order to achieve real-time updates, the api uses long polling.

        When you send the api request to `/listen/shipments`, you will immediately receive any update that has happened since your previous call,

        up to the number configured with the maxSize attribute.

        If no updates have happened since your previous call, the api request will not return immediately.

        The request will return when a new update has become available or when the maxTimeout is reached.

        After the api response has returned, and the client has finished processing the updates, you should always call the `/updatePosition` api, immediately followed by a call to `/listen/shipments`.

        By calling `/listen/shipments` again for the next update batch, this turns into a continuous process so that we can guarantee a quick response with real-time updates.

        With this setup, you will receive updates as fast as you can process them.


        ## Usage

        Using the Tracking API should be a continuous process, running 24/7, looping through the following sequence of API calls

        1. Call `/listen/shipments`

        2. Process the updates that were returned

        3. Immediately after 2., call `/updatePosition` when done with your updates (even if the /listen response was empty, the index was null etc.)

        4. Keep repeating 1 and 2

        5. When your process needs to stop, restart or redeploy, call `/disconnectClient`


        **Important:**

        - Implement this as a continuous loop where `/listen` is called immediately after `/updatePosition`. Do not use scheduled tasks (cron jobs), as this causes updates to accumulate faster than they can be processed, preventing real-time tracking.

        - Keep the timeout as high as possible (we recommend the default of 95000 ms). Results are returned immediately when available, but a higher timeout reduces connection overhead when updates are less frequent.'
      operationId: _06_listen
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetShipmentUpdates'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentUpdateBatch'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /listen/all:
    post:
      tags:
      - Tracking API
      summary: Listen to ALL updates
      description: 'Listen in real-time to shipment, voyage and detachedHandling updates.


        Read the section describing working of the Tracking API carefully.'
      operationId: _07_listenAll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAllUpdates'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllUpdateBatch'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /listen/road:
    post:
      tags:
      - Tracking API
      summary: Listen to road voyage updates
      description: 'Listen in real-time to road voyage updates only.


        Requires HinterlandProcessAdministrator role.


        Read the above section describing working of the Tracking API carefully.'
      operationId: _09_listenRoadVoyages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRoadVoyageUpdates'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HinterlandUpdateBatch'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
components:
  schemas:
    Shipment:
      required:
      - data
      - goods
      - id
      - movements
      type: object
      properties:
        id:
          type: string
          description: The id of this shipment
        data:
          title: ''
          type: ''
          description: The shipment data as reported by the forwarder
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/ShipmentData'
        movements:
          type: array
          description: One or more movements to transport this shipment from origin to destination
          items:
            $ref: '#/components/schemas/CargoMovement'
        goods:
          type: array
          description: The shipped goods
          items:
            $ref: '#/components/schemas/ContainedGood'
        forwarders:
          type: array
          description: Organisations that have delegated the inland transport to another inland operator (or forwarder)
          items:
            $ref: '#/components/schemas/HinterlandOrganisation'
        releaseToParty:
          title: ''
          type:
          - ''
          - 'null'
          description: Party that will receive the commercial release.
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/HinterlandOrganisation'
        cargoWeight:
          type:
          - number
          - 'null'
        currentReleaseToPartyFullName:
          type:
          - string
          - 'null'
      description: A shipment of goods from origin to destination. A shipment is unique identified by a combination of B/L number and equipment number. Shipments are typically created by the shipper (consignor) or forwarder responsible for the cargo.
    DisconnectClient:
      required:
      - clientId
      type: object
      properties:
        clientId:
          type: string
          description: The client you wish to disconnect.
    GetAllUpdates:
      required:
      - clientId
      type: object
      properties:
        clientId:
          type: string
          description: 'Identifies different clients within a consumer. So this is a unique id for your tracking client software, which you can choose yourself.

            Unless you want to loadbalance, send the same clientId in every API request.

            If you do wish to use multiple clients to loadbalance,

            each client should send a different clientId.

            Updates will be loadbalanced between the active clientIds.'
        maxSize:
          type:
          - integer
          - 'null'
          description: Limits the amount of updates received (nr of voyages / detached handlings / shipments) in each update batch. Default is 32.
          format: int32
        maxTimeout:
          minimum: 10000
          type:
          - integer
          - 'null'
          description: 'Limits how long the request will wait for new updates (in milliseconds). Default, maximum and recommended is 95000 ms. IMPORTANT: If a result is found sooner, it will be returned immediately. A higher timeout reduces connection overhead when updates are less frequent, which is important for our performance.'
          format: int64
          example: 95000
        version:
          maximum: 2
          minimum: 0
          type:
          - integer
          - 'null'
          description: Version of the Updates that will be received. Defaults to 0. Higher versions may include additional fields or structural changes to the response objects.
          format: int32
    TerminalRejectReason:
      required:
      - parsedReason
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: The error code sent by the terminal
        terminalDescription:
          type:
          - string
          - 'null'
          description: The error description sent by the terminal
        parsedReason:
          type: string
          description: A user friendly description of the error code
    HandlingWindow:
      required:
      - end
      - start
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: For loading this constitutes the commercial release window, for discharge the cargo opening/closing.
    HinterlandOrganisation:
      required:
      - fullName
      - shortName
      type: object
      properties:
        fullName:
          type: string
          description: The full name of the organisation
        shortName:
          type: string
          description: The short name of the organisation
        emailAddress:
          type:
          - string
          - 'null'
          description: The email address of the organisation
        address:
          type:
          - string
          - 'null'
          description: The address of the organisation
        city:
          type:
          - string
          - 'null'
          description: The city where the organisation is located
        countryUnCode:
          type:
          - string
          - 'null'
          description: The UN code of the country where the organisation is located
        countryName:
          type:
          - string
          - 'null'
          description: The name of the country where the organisation is located
        zipCode:
          type:
          - string
          - 'null'
          description: The zip code of the organisation
        phoneNumber:
          type:
          - string
          - 'null'
          description: The phone number of the organisation
        faxNumber:
          type:
          - string
          - 'null'
          description: The fax number of the organisation
        contact:
          type:
          - string
          - 'null'
          description: The contact person of the organisation
        customsEORINumber:
          type:
          - string
          - 'null'
          description: The EORI number of the organisation, issued by customs
        ean:
          type:
          - string
          - 'null'
          description: The EAN code of the organisation
        chamberOfCommerceNumber:
          type:
          - string
          - 'null'
          description: The chamber of commerce number of the organisation
        scacCode:
          type:
          - string
          - 'null'
          description: The SCAC code of the organisation
      description: Party that will receive the commercial release.
    UpdatePosition:
      required:
      - clientSegment
      type: object
      properties:
        lastIndex:
          type:
          - integer
          - 'null'
          description: Updates the lastIndex position. Always send the lastIndex that was received in preceding `/listen` call, even if you received null. If the client processing failed halfway through the message batch, you can send the index of the last successfully processed message in the batch. If client processing failed completely, do not increase the position of the lastIndex, or messages will be lost.
          format: int64
        clientSegment:
          maxItems: 2
          minItems: 2
          type:
          - array
          - 'null'
          description: Send the clientSegment that was received in the preceding `/listen` call. Each segment has a separate lastIndex position, since different clients will be at different positions.
          example:
          - 0
          - 128
          items:
            type: integer
            description: Send the clientSegment that was received in the preceding `/listen` call. Each segment has a separate lastIndex position, since different clients will be at different positions.
            format: int32
    Terminal:
      required:
      - allowedModalities
      - bicsCode
      - location
      - quayName
      - shortName
      - terminalSettings
      type: object
      properties:
        shortName:
          type: string
          description: Code issued by Portbase to identify the Terminal organisation.
        ean:
          type:
          - string
          - 'null'
          description: European Article Numbering issued by Secure Logistics to identify the Terminal organisation.
        bicsCode:
          type: string
          description: Terminal code according to the Terminal code table of Binnenvaart Informatie- en Communicatie Systeem managed by Rijkswaterstaat.
          example: 00DDE
        quayName:
          type: string
          description: The name of the quay where a vessel can moor for loading, unloading or e.g. awaiting orders.
          example: DDE
        smdgCode:
          type:
          - string
          - 'null'
          description: Terminal facility code according to the Shipplanning Message Development Group.
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
        displayNameOverrides:
          title: ''
          type: ''
          description: Quay name override per modality
          deprecated: false
          allOf:
          - type: object
            additionalProperties:
              type:
              - string
              - 'null'
              description: Quay name override per modality
            description: Quay name override per modality
        requiredDataAuthorisations:
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - deepSeaEta
            - cargoOpening
            - expectedDischargeTime
        allowedModalities:
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        tarRequired:
          type: boolean
          description: Only relevant for road. Indicates whether the terminal uses TAR codes or not.
        roadStatusRequestAllowed:
          type: boolean
          description: Only relevant for road. Indicates whether the terminal can process road status requests.
        bargeStatusRequestForbidden:
          type: boolean
          description: Only relevant for barge. Indicates whether the terminal can process barge status requests. Default is false.
        cutoffPeriod:
          type:
          - string
          - 'null'
          description: Only relevant for rail. Indicates the cutoff period for the train composition upload (relative to the eta) for this terminal.
          format: duration
        loadDischargeListSettings:
          allOf:
          - $ref: '#/components/schemas/LoadDischargeListSettings'
        quaySelectByDeclarantForbidden:
          type: boolean
          description: Indicates whether the terminal can be used by the Declarant to send a visit declaration. Some terminals can only be selected by the terminal organisation or Nextlogic, if so this option is set to true.
        updateAllowed:
          type: boolean
          description: Indicates whether the terminal allows updates on pre-notifications, only for *barge*. Status requests can always be updated. Deprecated, use the handlingUpdateForbidden setting to see for which modality updates are forbidden
          deprecated: true
        handlingUpdateForbidden:
          type: array
          description: Indicates whether the terminal does not support updates on pre-notifications. When this list contains a modality, updates are not supported for this terminal for that modality only. Status requests can always be updated.
          items:
            type:
            - string
            - 'null'
            description: Indicates whether the terminal does not support updates on pre-notifications. When this list contains a modality, updates are not supported for this terminal for that modality only. Status requests can always be updated.
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        handlingUpdateBypassAllowed:
          type: array
          description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass whereby a handling is first cancelled at the terminal and then declared as a new pre-notification.
          items:
            type:
            - string
            - 'null'
            description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass whereby a handling is first cancelled at the terminal and then declared as a new pre-notification.
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        handlingMoveBypassAllowed:
          type: array
          description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass for MoveHandlings only. Update bypass means that a handling is first cancelled at the terminal and then declared as a new pre-notification.
          items:
            type:
            - string
            - 'null'
            description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass for MoveHandlings only. Update bypass means that a handling is first cancelled at the terminal and then declared as a new pre-notification.
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        maxSealNumberLength:
          type:
          - integer
          - 'null'
          description: Maximum length of the seal number.
          format: int32
        acceptAfterRejectForbidden:
          type: boolean
          description: Indicates whether the terminal does not allow a handling accept after a handling reject.
        terminalSettings:
          type: array
          description: Terminal settings restricting handling declarations depending on the type of declaration.
          items:
            $ref: '#/components/schemas/TerminalSettings'
        nextlogicParticipant:
          type: boolean
          description: Setting that indicates this terminal is a Nextlogic Integral Planning participant.
        prenotificationRestrictedToDeclarants:
          title: ''
          type: ''
          description: List of declarants per modality for which declaration declaring handlings is allowed. When there is no list for a modality all declarants are allowed, otherwise it is restricted to this list of declarant shortnames.
          deprecated: false
          allOf:
          - type: object
            additionalProperties:
              type: array
              description: List of declarants per modality for which declaration declaring handlings is allowed. When there is no list for a modality all declarants are allowed, otherwise it is restricted to this list of declarant shortnames.
              items:
                type:
                - string
                - 'null'
                description: List of declarants per modality for which declaration declaring handlings is allowed. When there is no list for a modality all declarants are allowed, otherwise it is restricted to this list of declarant shortnames.
            description: List of declarants per modality for which declaration declaring handlings is allowed. When there is no list for a modality all declarants are allowed, otherwise it is restricted to this list of declarant shortnames.
      description: The terminal location at which the containers are loaded onto and discharged from the barge. <br>Please refer to Reference Data API '[Get terminals](#operation/_08_getTerminals)' to resolve a valid Terminal and its attributes
    ApiModel:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: 'Enum: `"detachedHandling"` `"bargeVoyage"` `"roadVoyage"` `"railVoyage"`'
      discriminator:
        propertyName: type
        mapping:
          detachedHandling: '#/components/schemas/ApiDetachedHandling'
          bargeVoyage: '#/components/schemas/ApiBargeVoyage'
          railVoyage: '#/components/schemas/ApiRailVoyage'
          roadVoyage: '#/components/schemas/ApiRoadVoyage'
    HinterlandUpdateBatch:
      type: object
      properties:
        lastIndex:
          type:
          - integer
          - 'null'
          description: Returns the index of the last update sent to the client. If the client has successfully processed the updates in this api response, it should send this lastIndex value in its request to `/updatePosition`. If no request to `/updatePosition` is made before the next request to `/listen` the same updates will be received again.
          format: int64
        clientSegment:
          maxItems: 2
          minItems: 2
          type:
          - array
          - 'null'
          description: Returns the segment of messages that is allocated to the client. The start value is inclusive, the end value is exclusive. There are 128 segments. A clientSegment return value of [0,128] means that this client is receiving updates for all the segments. A return value of [64,128] means this client is receiving updates for the segments 64 (inclusive) to 128 (exclusive). Use this value in the request to `/updatePosition` after the updates have been processed successfully.
          items:
            type: integer
            description: Returns the segment of messages that is allocated to the client. The start value is inclusive, the end value is exclusive. There are 128 segments. A clientSegment return value of [0,128] means that this client is receiving updates for all the segments. A return value of [64,128] means this client is receiving updates for the segments 64 (inclusive) to 128 (exclusive). Use this value in the request to `/updatePosition` after the updates have been processed successfully.
            format: int32
        updates:
          type: array
          description: List of individual updates.
          items:
            $ref: '#/components/schemas/HinterlandUpdate'
    GetShipmentUpdates:
      required:
      - clientId
      type: object
      properties:
        clientId:
          type: string
          description: "Identifies different clients within a consumer. So this is a unique id for your tracking client software, which you can choose yourself.\n Unless you want to loadbalance, send the same clientId in every API request.\n If you do wish to use multiple clients to loadbalance,\n each client should send a different clientId.\n Updates will be loadbalanced between the active clientIds."
        maxSize:
          type:
          - integer
          - 'null'
          description: Limits the amount of updates received in each update batch. Default is 32.
          format: int32
        maxTimeout:
          minimum: 10000
          type:
          - integer
          - 'null'
          description: 'Limits how long the request will wait for new updates (in milliseconds). Default, maximum and recommended is 95000 ms. IMPORTANT: If a result is found sooner, it will be returned immediately. A higher timeout reduces connection overhead when updates are less frequent, which is important for our performance.'
          format: int64
          example: 95000
        version:
          maximum: 2
          minimum: 0
          type:
          - integer
          - 'null'
          description: Version of the Updates that will be received. Defaults to 0. Higher versions may include additional fields or structural changes to the response objects.
          format: int32
        pathFilters:
          type: array
