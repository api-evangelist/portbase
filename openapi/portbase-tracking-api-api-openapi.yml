        shipStoresDeclaration:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.visit.ApiShipStoresDeclaration'
        paxDeclarationSummaries:
          minItems: 1
          type: array
          description: The summary of the declaration of the crew and passengers information of the port visit
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.visit.ApiPaxDeclarationSummary'
        healthDeclaration:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.visit.health.ApiHealthDeclaration'
        declarationStatuses:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
            enum:
            - DECLARED
            - ACCEPTED
            - REJECTED
          description: 'The current status of each declaration made for this visit, keyed by declaration type.


            Each entry maps a declaration type (e.g. VISIT, SECURITY, WASTE, DANGEROUS_GOODS, CREW_AND_PASSENGERS, HEALTH, SHIP_STORES) to its latest status:

            - DECLARED: the declaration has been submitted and is awaiting a response from the receiving authority.

            - ACCEPTED: the declaration has been accepted by the receiving authority.

            - REJECTED: the declaration has been rejected by the receiving authority.


            A declaration type is only present in the map once it has been declared at least once; if a type is absent, no declaration of that type has been made for this visit. When a declaration is re-submitted, the map reflects the status of the most recent submission.


            DANGEROUS_GOODS is only included when dangerous goods are enabled for the visit, and its status is aggregated from all dangerous goods declarations: if any single dangerous goods declaration is rejected, the overall DANGEROUS_GOODS status is reported as REJECTED.'
        etaPortAis:
          type:
          - string
          - 'null'
          description: The estimated time of arrival at the given pilot station for the vessel call based on AIS information
          format: date-time
        ignoreEtaPortAis:
          type: boolean
          description: Indication whether the declarant chose to ignore the etaPortAis
          deprecated: true
        cancelled:
          type: boolean
          description: Indication whether the port visit is cancelled
        ataAcknowledged:
          type: boolean
          description: Indication whether customs has acknowledged the ATA of the visit
        orderIncomingMovement:
          type: boolean
          description: Indication whether ordering the incoming movement is enabled
          deprecated: true
        importDeclarations:
          type: array
          description: List of import declarations by the visit's cargo declarants
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.visit.ApiVisit_ApiImportDeclaration'
        transhipments:
          type: array
          description: Map of transhipments by consignment number
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.visit.transhipment.ApiTranshipment'
      description: State of the visit
