openapi: 3.1.0
info:
  title: Cargo Controller Export API
  description: "On this website, we provide more in depth advice on how to implement the Cargo Controller Export API in your own system.\n\nYou can download example messages, by using the 'Copy' button in the 'Response samples' in the specific sections.\nMore information about the JSON schemas can be downloaded at the top of this page.\n\n# About this API\nCargo Controller Export uses a REST-ful API and Webhooks (HTTPS calls). In the webhook updates, we send the latest known status (‘state’) of your cargo.\nIn addition, Portbase also sends the ‘event payload’, which contains only the differences compared to the previous information.\nIt is up to your organisation to decide which logic to use for storing the data: comparing differences between successive ‘state’ messages or processing the ‘event payload’.\n\n> Please note: in Cargo Controller _Import_, only the ‘state’ is sent, not the ‘event payload’.\n\nThe Cargo Controller Export API is used for tracking cargo and receiving real-time updates\
    \ on your tracked cargo.\nAfter tracking a booking (see Subscribe to a booking section), you will automatically receive all updates on it.\nAll data for that updated booking will be sent to a special webhook endpoint configured for your organisation. See for more information:\n\n* [Changelog](changelog.html)\n* [Cargo Controller Export API implementeren- functional scenario’s](https://support.portbase.com/hc/en-gb/articles/35206254759826-Implementing-the-Cargo-Controller-Export-API)\n* Events that trigger the webhook are summarized in the [Webhook events section](https://support.portbase.com/hc/en-gb/articles/34470451557010-API-webhook-events-for-Cargo-Controller-Export).\n\n# Configuration\n## 1. Set up\n### API access\nAuthentication is managed by using special Portbase authentication headers named 'Portbase-access-key-id' and 'Portbase-secret-access-key'.\nYour access keys will be emailed to the administrator of your organisation (as nominated in your service application). If you\
    \ are a software supplier, then it concerns your client’s organization.\n\n### Webhook configuration\nAll webhook configuration is managed by Portbase. Please contact our sales department (sales@portbase.com) if you would like to register a webhook.\nAlong with a url, one or more email addresses are mandatory to which we can reach out if an error on your webhook occurred. It is possible to register multiple webhooks.\n\n## 2. Send request to Cargo Controller Export API\nSend a subscribe request as described at [Subscribe to a booking](#tag/Bookings/operation/subscribe).\n\n## 3. Receive and process Webhook events\nA so-called 'webhook' (also known as web callback or HTTP push API) allows you to efficiently build a custom integration with Cargo Controller Export.\nAs soon as they occur, we will send updates concerning your tracked cargo to your preconfigured webhook(s).\nFor each update on your tracked cargo, we will post an HTTP call to the URL that you specify in your configuration.\n\
    Therefore, your endpoint must be open to HTTP POST-requests and able to receive the payload containing the updated cargo.\nThe payload structure can be found at the [Event-API](#tag/Event-API) section.\n\n### Webhook authentication\nEach request (message) that we post to your webhook is signed by us.\nA header named ***X-Webhook-Signature*** which contains a JSON Web Token (JWT) will be present in the request.\nYou can use this token to verify whether the request originated from Portbase.\n \n*For security reasons we strongly suggest that you implement verification of this token in your webhook endpoint before handling the request*.\n    In order to do so, our public key for verification of the token signature can be found at [JSON Web Key Set](#tag/Event-API/operation/getJwks).\n \nFor more information on JSON Web Tokens you can see <a target=\"_blank\" href=\"https://jwt.io/\">https://jwt.io/</a>\n \nMake sure to whitelist our IPs in your firewall. All webhook udates will be sent through\
    \ one of the following IP addresses:\n- 34.253.113.23\n- 34.249.227.133\n- 34.253.114.17\n \n"
  contact:
    name: Portbase - Team Import Cargo
