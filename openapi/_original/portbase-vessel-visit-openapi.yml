openapi: 3.0.1
info:
  title: Portbase vessel visit API
  description: "# Introduction\n## API Versions\nAPI version numbers are used to denote incompatible changes. Whenever an incompatible change is made to the API, the version number will be raised. Changes that are backwards compatible can be applied at any time. Past versions of the API will eventually become unsupported. At present, the current version number of the API is 2, but versions 1 and 0 are still available as well. Not specifying a version number is equivalent to requesting version number 0. In the future, specifying a version number will become mandatory.\n\nA list of backwards incompatible changes can be found below.\n\n### Backwards incompatible changes in version 1\nIn `LocalMovement`, the valid cargo descriptions for the `cargo` field have been updated.\n\n### Backwards incompatible changes in version 2\nIn `PortOfCall`, the `notRequiringTugBoats` field has been removed. It contained the same information as the `tugBoatsRequired` field that was introduced in version 1 of\
    \ the API, but its value was inverted.\n\nIn `BerthVisit`, the `status` field has been removed. It has been replaced by the `externalInfo` field which contains more information and is ordered by source. See `BerthVisitInfo` for more details.\n\n`TerminalInfo` replaces `TerminalStatus`. Several fields have been renamed: `expectedWorkStart` is now called `expectedFirstLift`, `workStarted` is now called `firstLift`, `expectedWorkEnd` is now called `expectedLastLift`, `workEnded` is now called `lastLift`, `mooring` is now called `mooringOrientation` and `bollardAlt` is now called `bollardAft`.\n\nSeveral other types have also been renamed, without structural changes.\n\nMultiple fields have been deprecated. We intend to remove these fields in a future version of the API. Please note that in general deprecation does not guarantee that the field will be removed from the next version of the API, nor is there any guarantee that a field that is not deprecated will be present in future versions\
    \ of the API.\n\n### Backwards incompatible changes in version 3\nIn `BerthVisit`, the `berth` field is optionally instead of required. `Berth` is null whenever the berthVisit is still in planning mode with the terminal. When tracking using version 2 these berthVisits will be skipped.\n\nIn `PortOfCall`, the `nauticalServicesApplicable` field has been removed.\n\n### Backwards incompatible changes in version 4\nThe `version` and `maxTimeout` parameters are now mandatory.\n\nThe minimum value of `maxTimeout` has been raised to 10000 [ms].\n\n### Backwards incompatible changes in version 5\nThe `maxSize` parameter is now mandatory and has a maximum value of 64.\n\n#### ConsignmentProcess API\nIn `status.filingStatusTemporaryStorage` the field `temporaryStorageErrorNotification` has been removed and this information is now stored in\n`status.filingStatusTemporaryStorage.registrationResponse`\n\n### Backwards incompatible changes in version 6\nIn `ContainerProcess`, the `status` field has\
    \ new possible values: `SHORTLANDED` and `REMAINS_ON_BOARD`.\n\n## API Access\nAuthentication is done using special Portbase authentication headers named `Portbase-access-key-id` and `Portbase-secret-access-key`.\n\nTo obtain your access key for production, send an email to customerservice@portbase.com. For test environments contact the development team.\n## Notations used\nAll fields indicated with type `date-time` are strings in ISO format, e.g. \"2019-12-04T18:40:59Z\".\n## Track updates\nTo receive real-time updates about port visits, the Tracking API can be used.\n## Error response format\nWhen a validation error occurs or any other error for that matter, the response returns with the corresponding HTTP code and an errormessage in the following format:\n```{\n \"error\": \"message that indicates what the error was\"\n}```"
  contact:
    name: Portbase portvisit team
    url: https://portvisit.pcs.portbase.com
    email: customerservice@portbase.com
  version: '6.0'
  x-logo:
    url: Portbase_WB_RGB.png
    altText: Portbase logo
