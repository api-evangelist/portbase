- name: Consignments API
  description: This is a API for sending Bill of Ladings.
- name: Ship Operator API - terminal planning
  description: This api can be used for settling the terminal planning with the stevedores. <br>The happy flow consists preferably of the next steps:<ul>  <li>declare terminal plannings</li>  <li>update terminal plannings</li>  <li>approve each terminal planning</li><li>finish terminal planning</li></ul>
paths:
  /commercialRelease:declare:
    post:
      tags:
      - Commercial Release API
      summary: Declare commercial release
      description: This endpoint can be used to create or update a commercial release.
      operationId: _01_declareCommercialRelease
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.commercialrelease.input.InputCommercialReleaseData'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.portbase.bezoekschip.adapter.CommercialReleaseEndpoint_DeclareCommercialReleaseResult'
  /listen:
    post:
      tags:
      - Tracking API
      summary: Listen to visit updates
      description: "Listen in real-time to all vessel visit updates. \n\nIn order to achieve real-time updates, the api uses long polling. \nWhen you send the api request to /listen, you will immediately receive any vessel visit update that has happened since your previous call, \nup to the number configured with the maxSize attribute. \nIf no updates have happened since your previous call, the api request will not return immediately. \nThe request will return when a new update has become available or when the maxTimeout is reached. \nAfter the api response has returned, and the client has finished processing the updates, you should call the /updatePosition api. \nThen you will be able to call /listen again for the next update batch. \nWith this setup, you will receive updates as fast as you can process them. \n\nDefault call order: \n- Call /listen \n- Call /updatePosition (even if the /listen response was empty)\n- Keep repeating 1 and 2 \n- When done, call /disconnectClient\n\nNote that\
        \ there is only one tracking position per API key. If you need to feed data into multiple\nindependent consumers make sure each uses it's own key\n\nMore details on how to correctly use this endpoint can be found in the descriptions of the request and response models below"
      operationId: _01_listenForVisitUpdates
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.visit.GetVisitUpdates'
      responses:
        '206':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.visit.VisitUpdateBatch'
  /commercialRelease:cancel:
    post:
      tags:
      - Commercial Release API
      summary: Cancel commercial release
      description: This endpoint can be used to cancel a commercial release.
      operationId: _02_cancelCommercialRelease
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.commercialrelease.CancelCommercialRelease'
      responses:
        '204':
          description: successful operation
  /updatePosition:
    post:
      tags:
      - Tracking API
      summary: Update position
      description: "The /updatePosition endpoint lets us know which messages have been successfully processed by the client. \n\nThe purpose of the endpoint is to protect against losing messages when client processing fails.\nThe endpoint should be called after every /listen call. \nIf the position is not updated after a /listen call, the same messages will be sent again in the next /listen call. \n\nSee /listen for more information"
      operationId: _02_updatePosition
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.visit.UpdatePosition'
      responses:
        '204':
          description: successful operation
  /commercialRelease:accept:
    post:
      tags:
      - Commercial Release API
      summary: Accept commercial release
      description: This endpoint SHOULD NOT be used by terminals to accept a commercial release.
      operationId: _03_acceptCommercialRelease
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.commercialrelease.AcceptCommercialRelease'
      responses:
        '204':
          description: successful operation
      deprecated: true
  /resetPosition:
    post:
      tags:
      - Tracking API
      summary: Reset position
      description: 'Clients can reset their tracking index to any point in time (past or future) using this endpoint.


        Either index or timestamp is required. If both index and timestamp are present, index will be used and timestamp ignored.'
      operationId: _03_resetPosition
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.visit.ResetPosition'
      responses:
        '204':
          description: successful operation
  /disconnectClient:
    post:
      tags:
      - Tracking API
      summary: Disconnects client
      description: "When your polling client goes down, due to redeployment or to processing errors, you should call this api. \nThis endpoint disconnects a client immediately, releasing the segments allocated to the client, to be allocated to the remaining active clients. \n\nWhen you take a client offline, and do not call /disconnectClient, \nthe messages in the segment of the offline client will not be received by the remaining clients for a few minutes. \nIf you reuse clientIds when redeploying, and have not disconnected the old clientId first, you might not be able to poll successfully for some time. "
      operationId: _04_disconnectClient
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.visit.DisconnectClient'
      responses:
        '204':
          description: successful operation
  /commercialRelease:reject:
    post:
      tags:
      - Commercial Release API
      summary: Reject commercial release
      description: This endpoint SHOULD NOT be used by terminals to reject a commercial release.
      operationId: _04_rejectCommercialRelease
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.commercialrelease.RejectCommercialRelease'
      responses:
        '204':
          description: successful operation
      deprecated: true
  /listen/all:
    post:
      tags:
      - Tracking API
      summary: Listen to any updates
      description: "Listen in real-time to any type of update. Use `updateTypes` to specify what updates to receive. \n\nIn order to achieve real-time updates, the api uses long polling. \nWhen you send the api request to /listen/all, you will immediately receive any update that has happened since your previous call, \nup to the number configured with the maxSize attribute. \nIf no updates have happened since your previous call, the api request will not return immediately. \nThe request will return when a new update has become available or when the maxTimeout is reached. \nAfter the api response has returned, and the client has finished processing the updates, you should call the /updatePosition api. \nThen you will be able to call /listen/all again for the next update batch. \nWith this setup, you will receive updates as fast as you can process them. \n\nDefault call order: \n- Call /listen/all \n- Call /updatePosition (even if the /listen/all response was empty)\n- Keep repeating 1 and\
        \ 2 \n- When done, call /disconnectClient\n\nMore details on how to correctly use this endpoint can be found in the descriptions of the request and response models below"
      operationId: _05_listenForAnyUpdates
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.common.GetAnyUpdates'
      responses:
        '206':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.common.AnyUpdateBatch'
