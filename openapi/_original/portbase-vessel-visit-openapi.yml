components:
  schemas:
    com.portbase.bezoekschip.adapter.CommercialReleaseEndpoint_DeclareCommercialReleaseResult:
      title: DeclareCommercialReleaseResult
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'Unique identifier of the commercial release within Portbase. '
          example: 17fe4b13-0bb7-4623-b0e4-db6ce7cedbad
    com.portbase.bezoekschip.common.api.cargo.common.SizeType:
      title: SizeType
      required:
      - code
      type: object
      properties:
        code:
          maxLength: 4
          minLength: 0
          type: string
          description: The coded container's length, width, height, type and features.
          example: 22G1
        name:
          type: string
          description: The descriptive name of the size type of container as specified with the code.
          nullable: true
          example: 20'x8'x8'6\" General Purpose Container
      description: The classification of the container's length, width, height, type and features.<br>Use a size type retrieved with find size types via the Reference Data API '[Find SizeTypes](#operation/_06_findSizeTypes)'.
      nullable: true
    com.portbase.bezoekschip.common.api.commercialrelease.input.InputCommercialReleaseData:
      title: InputCommercialReleaseData
      required:
      - consignmentNumber
      - containerOperatorCode
      - equipmentNumber
      - releaseToPartyCode
      - terminalCode
      type: object
      properties:
        equipmentNumber:
          minLength: 1
          type: string
          description: Unique identifier of the container.
        empty:
          type: boolean
          description: Indication whether the container is full or empty.
        consignmentNumber:
          type: string
          description: Synonym of Bill of Lading number. Unique identifier of the consignment in the container. If multiple consignments are present in the container, fill in the first consignment number.
          nullable: true
        releaseDeadline:
          type: string
          description: The commercial release is valid until this datetime.
          format: date-time
          nullable: true
        releaseModality:
          type: string
          description: The modality of the on-carriage transport.
          nullable: true
          enum:
          - road
          - rail
          - barge
          - sea
        remarks:
          type: string
          description: Remarks about this release from the carrier.
          nullable: true
        releaseReference:
          type: string
          description: Reference number of the release as it is known with the carrier. This is *not* the pin code of the container.
          nullable: true
        sizeType:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.cargo.common.SizeType'
        crn:
          type: string
          description: The call reference number of the visit
          nullable: true
        terminalCode:
          minLength: 1
          type: string
          description: The SMDG code of the terminal to send this commercial release to.
        containerOperatorCode:
          minLength: 1
          type: string
          description: The SMDG code of the box operator authorising this commercial release.
        releaseToPartyCode:
          minLength: 1
          type: string
          description: Identity of the customer of this carrier which is given the permission to pick up the container. Note, this code needs to be registered by the customer in Portbase service Cargo Controller before it is used by the carrier.
        inlandOperatorEanCode:
          type: string
          description: 'The inland-operator which is nominated by the cargo director (the carrier department / subsidiary) to

            pick-up the container from the terminal. Every inland-operator active at the Port of Rotterdam terminals

            has been issued an identifier by Secure Logistics in the format of an EAN-code. This is the unique

            identifier used by Portbase and the terminals to identify parties.

            '
          nullable: true
    com.portbase.bezoekschip.common.api.commercialrelease.CancelCommercialRelease:
      title: CancelCommercialRelease
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: Unique identifier of the commercial release within Portbase.
    com.portbase.bezoekschip.common.api.commercialrelease.AcceptCommercialRelease:
      title: AcceptCommercialRelease
