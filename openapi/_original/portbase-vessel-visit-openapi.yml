  /consignment/straight-bl-single-filing:
    post:
      tags:
      - Consignments API
      summary: 'Send a straight bill of lading for single filing. (IE3F10) '
      description: 'Straight bill of lading is a non-negotiable bill of lading.

        Under this bill of lading, the shipping company will deliver the shipment to its consignee

        on presentation of identification. It is also called consignment bill of lading.

        The bill of lading states that the goods are consigned to a specified person and

        it is not negotiable. A straight bill of lading is a document in which a seller agrees

        to use a specific transportation to ship goods to a certain location, and the bill

        is assigned to a specific party. The straight bill of lading details the type, quality,

        and quantity of the good. It also serves as the receipt upon arrival at the destination.

        Because it is assigned to a specific party, it is not negotiable and may not be

        re-assigned to another party.


        Single filing means that the data is provided in one complete ENS filing where all necessary

        data is available to the party that files. As carrier, you will have to obtain certain

        additional commercial data from the EU established consignee. If the consignee does not

        share the required data, you will need to declare its EORI in your partial ENS (F13)

        and the consignee will become responsible and liable for its partial filing into the ICS2 system.


        For consignments that will be discharged in NL, Portbase will automatically send a

        TSD to Dutch Customs once it has received a MRN from the ICS2 Shared Trader Interface (STI)

        '
      operationId: c01StraightBillOfLadingSingleFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.StraightBillOfLadingSingleFiling'
      responses:
        '204':
          description: successful operation
  /consignment/master-bl-single-filing:
    post:
      tags:
      - Consignments API
      summary: Send master and house bill of lading for single filing. (IE3F11)
      description: 'A bill of lading (BoL) is a document issued by a carrier (or his agent) to acknowledge

        receipt of cargo for shipment. It is a contractual document between the shipper/consignor

        of goods and the carrier detailing the type, quantity and destination of the goods

        being carried. The bill of lading also serves as a receipt of shipment when

        the goods are delivered at the predetermined destination.


        Single filing means that the data is provided in one complete ENS filing (F11) where all

        necessary data is available to the party that files. As carrier, you will have to obtain the

        necessary data from all underlying house bills of lading from the issuing freight forwarders

        (including express or postal operators issuing equivalent transport documents). The information

        required includes buyer and seller data available to the consignee at the lowest house bill of

        lading. If the freight forwarder does not share the required data, then you will need to

        submit a partial ENS (F12) based on your master bill of lading and declare the EORI of

        the freight forwarder in your filing. The freight forwarder will then become responsible

        for the house level data filing to ICS2 and will have to obtain data from other house bill of

        lading issuing parties or declare in its partial ENS filing the identity of parties still

        required to file.


        For consignments that will be discharged in NL, Portbase will automatically send a

        TSD to Dutch Customs once it has received a MRN from the ICS2 Shared Trader Interface (STI)

        '
      operationId: c02MasterBillOfLadingSingleFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.BillOfLadingSingleFiling'
      responses:
        '204':
          description: successful operation
  /consignment/master-bl-multiple-filing:
    post:
      tags:
      - Consignments API
      summary: Send a master bill of lading for multiple filing. (IE3F12)
      description: 'A bill of lading is a document issued by a carrier (or his agent) to acknowledge

        receipt of cargo for shipment. It is a contractual document between the shipper/consignor

        of goods and the carrier detailing the type, quantity and destination of the goods

        being carried. The bill of lading also serves as a receipt of shipment when

        the goods are delivered at the predetermined destination.


        Multiple filing means that the data is provided in multiple ENS filings by different parties.

        If the freight forwarder does not share the required data, then as carrier you will need to

        submit a partial ENS (F12) based on your master bill of lading and declare the EORI of the

        freight forwarder in your filing. The freight forwarder will then become responsible for the

        house level data filing to ICS2 and will have to obtain data from other house bill of lading

        issuing parties or declare in its partial ENS filing the identity of parties still required

        to file.


        For consignments that will be discharged in NL, Portbase will automatically send a TSD to Dutch

        Customs once it has received a MRN from the ICS2 Shared Trader Interface (STI)

        '
      operationId: c03MasterBillOfLadingMultipleFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.BillOfLadingMultipleFiling'
      responses:
        '204':
          description: successful operation
  /consignment/straight-bl-multiple-filing:
    post:
      tags:
      - Consignments API
      summary: Send a straight bill of lading for multiple filing. (IE3F13)
      description: 'Straight bill of lading is a non-negotiable bill of lading.

        Under this bill of lading, the shipping company will deliver the shipment to its consignee

        on presentation of identification. It is also called consignment bill of lading.

        The bill of lading states that the goods are consigned to a specified person and

        it is not negotiable. A straight bill of lading is a document in which a seller agrees

        to use a specific transportation to ship goods to a certain location, and the bill

        is assigned to a specific party. The straight bill of lading details the type, quality,

        and quantity of the good. It also serves as the receipt upon arrival at the destination.

        Because it is assigned to a specific party, it is not negotiable and may not be

        re-assigned to another party.


        Multiple filing means that the data is provided in multiple ENS filings by different parties.

        If the consignee does not share the required data, you will need to declare its EORI in your

        partial ENS (F13) and the consignee will become responsible and liable for its partial filing

        into the ICS2 system.


        For consignments that will be discharged in NL, Portbase will automatically send a TSD to

        Dutch Customs once it has received a MRN from the ICS2 Shared Trader Interface (STI)

        '
      operationId: c04StraightBillOfLadingMultpleFiling
      requestBody:
