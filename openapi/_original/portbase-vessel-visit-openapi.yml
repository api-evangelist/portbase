            including packaging, but excluding the carrier''s equipment for the declaration.


            Enter the total gross mass, expressed in kilograms, of the goods concerned by the relevant consignment,

            as indicated on the master level transport document. The gross mass is the aggregate mass of the goods

            with all their packing, excluding containers and other transport equipment.

            '
        placeOfAcceptance:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiPlaceOfAcceptance'
        supportingDocuments:
          maxItems: 99
          minItems: 0
