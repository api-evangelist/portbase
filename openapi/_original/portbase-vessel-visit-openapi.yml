      description: "    Functional Error Codes:\n        12\tIncorrect (code) value\n        13\tMissing\n        14\tValue not supported in this position (code value constraint)\n        15\tNot supported in this position\n        19\tInvalid decimal notation\n        26\tDuplicate detected\n        35\tToo many repetitions\n        37\tInvalid type characters\n        38\tMissing digit in front of decimal sign\n        39\tElement too long (length constraint)\n        40\tElement too short (length constraint)\n        70\tInvalid Means of Transport Identification Number\n        71\tHouse consignment in a wrong state\n        72\tENS filing in a wrong state\n        80\tUnknown Transport Document Reference\n        81\tDuplicate Transport Document Reference\n        90\tUnknown MRN\n        91\tDuplicate MRN\n        92\tMessage out of sequence\n        93\tInvalid MRN\n        94\tDuplicate LRN\n        95\tUniqueness Error\n        96\tIncorrect entity reference\n        97\tNot found\n\
        \        98\tUnknown reference\n        100\tNot satisfactory data quality\n        101\tIt is not possible to add new goods items or house consignments via an ENS filing amendment\n        102\tNot allowed Unicode character\n        103\tThe date and time of arrival cannot be earlier than the date and time of departure\n        104\tElement cannot be amended\n"
