          before:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.visit.ApiVisit'
          index:
            type: integer
            description: Index of this update
            format: int64
          timestamp:
            type: string
            description: Date and time in which this update occurred
            format: date-time
          triggeredByRecipient:
            type: boolean
            description: Indicator if the update has been triggered by the recipient
          updateType:
            type: string
            description: Type of this update. Defaults to VISIT if this update cannot be tied to any specific agent declaration.
            nullable: true
            deprecated: true
            enum:
            - VISIT
            - SECURITY
            - WASTE
            - DANGEROUS_GOODS
            - CREW_AND_PASSENGERS
            - HEALTH
            - SHIP_STORES
            - TERMINAL_UPDATE
            - COLLECTIONS
            - NOA
            - NOD
    com.portbase.bezoekschip.common.api.visit.VisitUpdateBatch:
      title: VisitUpdateBatch
      type: object
      properties:
        lastIndex:
          type: integer
          description: Returns the index of the last update sent to the consumer. If the consumer has successfully processed the updates in this api response, it should send this lastIndex value in its next api request. If this lastIndex is not sent in the next api request, we assume client processing has failed, and the same updates will be sent again.
          format: int64
          nullable: true
        lastTimestamp:
          type: string
          description: Timestamp of the last update sent to the consumer
          format: date-time
          nullable: true
        clientSegment:
          type: array
          description: Only relevant for multiclient consumers. Returns the segment of messages that is allocated to the client. There are 128 segments. A clientSegment return value of [0,32] means that this client is receiving all updates in the segments 0 to 32.
          nullable: true
          items:
            type: integer
            description: Only relevant for multiclient consumers. Returns the segment of messages that is allocated to the client. There are 128 segments. A clientSegment return value of [0,32] means that this client is receiving all updates in the segments 0 to 32.
            format: int32
        updates:
          type: array
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.visit.VisitUpdate'
    com.portbase.bezoekschip.common.api.visit.GetVisitUpdates:
      title: GetVisitUpdates
      required:
      - clientId
      - maxSize
      - maxTimeout
      - version
      type: object
      properties:
        clientId:
          minLength: 1
          type: string
          description: Identifies different clients within a consumer. Unless you want to loadbalance, send the same clientId in every API request. If you do wish to use multiple clients to loadbalance, each client should send a different clientId. Updates will be loadbalanced between the active clientIds.
        version:
          maximum: 6
          minimum: 0
          type: integer
          description: Version of the Updates that will be received.
          format: int32
        maxSize:
          maximum: 64
          minimum: 1
          type: integer
          description: Limits the amount of updates received in each update batch.
          format: int32
        maxTimeout:
          maximum: 55000
          minimum: 10000
          type: integer
          description: Limits how long the api request will wait for new updates before returning the request in milliseconds. A value of 50000 is recommended, but make sure your infrastructure can handle the selected timeout value.
          format: int64
        pathFilters:
          type: array
          description: Paths of a visit (starting with /) this tracker cares about, e.g. ['/importDeclarations', '/visitDeclaration']. If something changes outside of these paths the tracker will not get the update. Note that the tracker will still always get the entire visit returned (not just the selected paths).
          items:
            type: string
            description: Paths of a visit (starting with /) this tracker cares about, e.g. ['/importDeclarations', '/visitDeclaration']. If something changes outside of these paths the tracker will not get the update. Note that the tracker will still always get the entire visit returned (not just the selected paths).
            nullable: true
    com.portbase.bezoekschip.common.api.visit.UpdatePosition:
      title: UpdatePosition
      type: object
      properties:
        lastIndex:
          type: integer
          description: Updates the lastIndex position. Always send the lastIndex that was received in preceding /listen call, even if you received null. If the client processing failed halfway through the message batch, you can send the index the last successfully processed message in the batch. If client processing failed completely, do not increase the position of the lastIndex, or messages will be lost.
          format: int64
          nullable: true
        clientSegment:
          maxItems: 2
          minItems: 2
          type: array
          description: Send the clientSegment that was received in the preceding /listen call. Each segment has a separate lastIndex position, since different clients will be at different positions. If a lastIndex of null is given the clientSegment may be null as well, otherwise the clientSegment is required.
          nullable: true
          items:
            type: integer
            description: Send the clientSegment that was received in the preceding /listen call. Each segment has a separate lastIndex position, since different clients will be at different positions. If a lastIndex of null is given the clientSegment may be null as well, otherwise the clientSegment is required.
            format: int32
    com.portbase.bezoekschip.common.api.visit.ResetPosition:
      title: ResetPosition
      type: object
      properties:
        index:
          type: integer
          description: The new tracking index. May be omitted so long as `timestamp` is given.
          format: int64
          nullable: true
        timestamp:
          type: string
          description: The timestamp to reset this tracker's index to. May be omitted so long as `index` is given.
          format: date-time
          nullable: true
      description: Resets the lastIndex position of the sending tracker. Either index or timestamp is required. If both index and timestamp are present, index will be used and timestamp ignored.
