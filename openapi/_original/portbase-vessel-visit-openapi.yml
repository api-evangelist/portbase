      description: 'IE3N01 - The ENS filing is in a incorrect state regarding the ENS lifecycle’s sequence of the process.

        E.g. whether an ENS filing refers to a journey of a means of transport which arrived already

        in the past, or the goods covered by the ENS filing were already presented to the customs

        and effectively the ENS cannot be filed for the same goods already presented, or ENS cannot

        be amended or invalidated. For an ENS amendment, the state of the original ENS filing is must

        not be ''presented'' or at a state where, for example amendment of the ENS filing is not possible

        anymore (i.e. customs decided to perform controls, or trader notified by the customs that goods

