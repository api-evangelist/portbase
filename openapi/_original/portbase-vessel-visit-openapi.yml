          description: 'This entry concerns the unique commercial reference number assigned by the

            person concerned to the consignment in question.

            It may take the form of WCO (ISO 15459) codes or equialent.

            It provides access to underlying commercial data of interest to customs.

            '
          nullable: true
        passiveBorderTransportMeans:
          maxItems: 99
          minItems: 0
          type: array
          description: "        The passive means of transport that is being transported by the active means of transport.\n        It must be used for all stuffed cargo which is not stuffed in a container such as unaccompanied\n        as well as accompanied transport of  trailers, swap bodies, chassis. It must also\n        be used for vehicles.\n"
