        transportCharges:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiTransportCharges'
        placeOfDelivery:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiPlaceOfDelivery'
        goodsShipment:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiGoodsShipment'
        notifyParty:
          type: array
          description: 'The party that is to be notified by the carrier or shipping agent once the shipment arrives

            at its destination or reaches a certain point in transit.

            This notification typically includes information about the arrival of the shipment,

            its status, and any necessary instructions for further handling or delivery.

            '
