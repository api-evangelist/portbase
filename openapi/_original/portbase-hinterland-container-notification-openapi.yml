        dischargeTerminal:
          type: string
          description: The 5 digit UNLoCode (e.g. DEDUI, FRLLE) of the terminal where the cargo will be discharged. In case of a Rotterdam terminal; include the SMDG/BICS code (e.g., NLRTM00RWG, NLRTM00DDE)
        type:
