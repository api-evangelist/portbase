components:
  schemas:
    BargeAccessPoint:
      required:
      - code
      - name
      type: object
      properties:
        code:
          maxLength: 2
          minLength: 0
          type: string
          description: Code of a barge scope in or scope out accesspoint.
          example: BR
        name:
          type: string
          description: Name of a barge scope in or scope out accesspoint.
          example: Brienenoordbrug
      description: 'Entrypoint: The location at which the port visit starts. Also known as scope in.<br> Exitpoint: The location at which the port visit ends. Also known as scope out.'
    IntegralPlanningVoyageStatus:
      type: object
      properties:
        eta:
          type: string
          description: The time of arrival at the entry point of the port as estimated by Nextlogic.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        etd:
          type: string
          description: The time of departure from the exit point of the port as estimated by Nextlogic.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        pta:
          type: string
          description: The planned time of arrival at the entry point of the port.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        ptd:
          type: string
          description: The planned time of departure from the exit point of the port.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        ata:
          type: string
          description: The actual time of arrival at the entry point of the port as given by Nextlogic.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        atd:
          type: string
          description: The actual time of departure from the exit point of the port as given by Nextlogic.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        plannedEntryPoint:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/BargeAccessPoint'
        plannedExitPoint:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/BargeAccessPoint'
        actualEntryPoint:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/BargeAccessPoint'
        actualExitPoint:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/BargeAccessPoint'
        netTime:
          type: integer
          description: The net time in minutes of this rotation calculated by Nextlogic.
          format: int32
          nullable: true
        slackTime:
          type: integer
          description: The slack time in minutes of this rotation calculated by Nextlogic.
          format: int32
          nullable: true
        normTime:
          type: integer
          description: The norm time in minutes of this rotation calculated by Nextlogic.
          format: int32
          nullable: true
        alerts:
          type: array
          description: Any alerts from Nextlogic while processing this voyage.
          items:
            $ref: '#/components/schemas/NextlogicAlert'
      description: '`Integral planning` Nextlogic status for this voyage.'
    NextlogicAlert:
      required:
      - code
      - description
      - severity
      type: object
      properties:
        code:
          type: string
          description: Alert code from Nextlogic Optimizer.
        description:
          type: string
          description: Human readable description of the alert.
        severity:
          type: string
          description: Indication of how severe this alert is, indicating if it is blocking the integral planning process.
          enum:
          - ACTION_LOW_PRIO
          - ACTION_HIGH_PRIO
          - INFORMATIVE
        forBargeOperator:
          type: boolean
          description: Is this alert meant for the declarant (barge operator)?
        forTerminalOperator:
          type: boolean
          description: Is this alert meant for the terminal?
      description: Alert from Nextlogic Optimizer.
    PlanVoyage:
      required:
      - status
      - voyageId
      type: object
      properties:
        voyageId:
          type: string
          description: Unique identifier of the voyage which was generated on the creation of the voyage
        status:
          allOf:
          - $ref: '#/components/schemas/IntegralPlanningVoyageStatus'
    IllegalCommandException:
      type: object
      properties:
        message:
          type: string
          nullable: true
    Bollard:
      required:
      - bicsCode
      - metersToNextBollard
      - number
      type: object
      properties:
        bicsCode:
          type: string
          description: The Binnenvaart Informatie- en Communicatie Systeem (BICS) code for the Terminal.
        number:
          type: string
          description: Distinct bollard description, unique per quay. Can be just the bollard number or a text prefix with the bollard number.
          example: DDE-59
        coordinates:
          title: ''
          type: ''
          description: The geographical position of the bollard.
          nullable: true
          readOnly: true
          deprecated: true
          allOf:
          - $ref: '#/components/schemas/Coordinates'
        metersToNextBollard:
          type: number
          description: The number of meters to the next bollard in the sequence.
          readOnly: true
        mooringSide:
          type: string
          description: A ship’s mooring side for mooring near this bollard.
          nullable: true
          readOnly: true
          enum:
          - port
          - starboard
      description: '`Integral planning` Physical location on the quay.'
    Coordinates:
      required:
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          maximum: 90
          minimum: -90
          type: number
          description: The decimal degrees from the equator
        longitude:
          maximum: 180
          minimum: -180
          type: number
          description: The decimal degrees from the Prime Meridian (Greenwich)
      description: The geographical position of the bollard.
      readOnly: true
      deprecated: true
    Crane:
      type: object
      properties:
        name:
          type: string
          nullable: true
        speed:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        maxWidth:
          type: number
          nullable: true
        outreach:
          type: integer
          format: int32
          nullable: true
        twinningAllowed:
          type: boolean
          nullable: true
        liftCapacity:
          type: integer
          format: int32
          nullable: true
        canHandleFullContainers:
          type: boolean
          nullable: true
        canHandleOOG:
          type: boolean
          nullable: true
        canHandleBundles:
          type: boolean
          nullable: true
      description: The cranes used in this call as indicated by integral planning.
    GetTerminalByBicsCode:
      required:
      - bicsCode
      type: object
      properties:
        bicsCode:
          type: string
          description: Terminal code according to the Terminal code table of Binnenvaart Informatie- en Communicatie Systeem managed by Rijkswaterstaat.
      description: Get terminal by specified bicsCode.
    IntegralPlanningVisitStatusRequest:
      type: object
      properties:
        terminal:
          title: ''
          type: ''
          description: The planned terminal (quay), this can (but does not have to) be different than the requested terminal.
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/GetTerminalByBicsCode'
        eta:
          type: string
          description: The time of arrival at the terminal as estimated by integral planning.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        etd:
          type: string
          description: The time of departure from the terminal as estimated by integral planning.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        pta:
          type: string
          description: The planned time of arrival at the terminal.
          format: date-time
          nullable: true
          example: '2018-04-24T04:58:49.132Z'
        ptd:
          type: string
          description: The planned time of departure from the terminal.
          format: date-time
          nullable: true
          example: '2018-04-24T04:58:49.132Z'
        ata:
          type: string
          description: The actual time of arrival at the terminal as given by integral planning.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        atd:
          type: string
          description: The actual time of departure from the terminal as given by integral planning.
          format: date-time
          nullable: true
          example: '2019-09-12T21:34:22Z'
        plannedHandlings:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/PlannedHandlings'
        totalNetTeu:
          type: number
          description: The total net teu calculated by integral planning.
          nullable: true
        fromBollard:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Bollard'
        toBollard:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Bollard'
        bestMooringPosition:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Bollard'
        cranes:
          type: array
          description: The cranes used in this call as indicated by integral planning.
          items:
            $ref: '#/components/schemas/Crane'
        lastUpdate:
          type: string
          description: The time of the last integral planning update with a change for this visit.
          format: date-time
          nullable: true
        alerts:
          type: array
          description: Any alerts from the integral planning while processing this visit.
          items:
            $ref: '#/components/schemas/NextlogicAlert'
    PlanVisitRequest:
      required:
      - status
      - visitId
      type: object
      properties:
        status:
          title: ''
          type: ''
          description: ''
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/IntegralPlanningVisitStatusRequest'
        visitId:
          type: string
          description: Unique identifier of the visit which was generated on the creation of the visit
          example: '75111204'
    PlannedHandlings:
      type: object
      properties:
        dischargeTotal:
          maximum: 9999
          minimum: 0
          type: integer
          description: The number of all the containers to be discharged.
          format: int32
          nullable: true
        dischargeOutOfGauge:
          maximum: 9999
          minimum: 0
          type: integer
          description: The number of non-standard containers to be discharged as the cargo doesn't fit inside a standard container as it exceeds its standard dimensions.
          format: int32
          nullable: true
        dischargeTwinnable:
          maximum: 9999
          minimum: 0
          type: integer
          description: The number of to be discharged containers, loaded side by side in such a way that they can be lifted of the barge in one crane move.
          format: int32
          nullable: true
        dischargeEmpty:
          minimum: 0
          type: integer
          description: The number of standard empty containers to be discharged.
          format: int32
          nullable: true
        dischargeStacked:
          minimum: 0
          type: integer
          description: '`Integral planning` The number of containers (flatracks) stacked in bundles.'
          format: int32
          nullable: true
        dischargeBundles:
          minimum: 0
          type: integer
          description: '`Integral planning` The number of bundles.'
          format: int32
          nullable: true
        loadingTotal:
          maximum: 9999
          minimum: 0
          type: integer
          description: The number of all the containers to be loaded.
          format: int32
          nullable: true
        loadingOutOfGauge:
          maximum: 9999
          minimum: 0
          type: integer
          description: The number of non-standard containers to be loaded as the cargo doesn't fit inside a standard container as it exceeds its standard dimensions.
          format: int32
          nullable: true
        loadingTwinnable:
          maximum: 9999
          minimum: 0
          type: integer
          description: The number of containers to be loaded side by side in such a way that they can be lifted of the barge in one crane move.
          format: int32
          nullable: true
        loadingEmpty:
          minimum: 0
          type: integer
          description: The number of standard empty containers to be loaded.
          format: int32
          nullable: true
        loadingStacked:
          minimum: 0
          type: integer
          description: '`Integral planning` The number of containers (flatracks) stacked in bundles.'
          format: int32
          nullable: true
        loadingBundles:
          minimum: 0
          type: integer
          description: '`Integral planning` The number of bundles.'
          format: int32
          nullable: true
        shifters:
          maximum: 9999
          minimum: 0
          type: integer
          description: The number of containers to be relocated on board of a barge vessel during a terminal visit.
          format: int32
          nullable: true
      description: The number of full and empty containers to be discharged, loaded and shifted during a terminal visit, as planned by integral planning. Required for any planning containing the pta and ptd.
    IntegralPlanningHandlingStatus:
      type: object
      properties:
        alerts:
          type: array
          description: Any alerts from Nextlogic while processing this handling.
          items:
            $ref: '#/components/schemas/NextlogicAlert'
      description: '`Integral planning` Nextlogic status for this handling.'
    PlanHandling:
      required:
      - handlingId
      - status
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
          example: d7727b42-b7d3-490e-aa70-619d7717b1d1
        status:
          allOf:
          - $ref: '#/components/schemas/IntegralPlanningHandlingStatus'
    CreateHandlingResult:
      required:
      - handlingId
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the cargo handling which was generated on the creation of the handling.
          example: 17fe4b13-0bb7-4623-b0e4-db6ce7cedbad
    BargeHandlingData:
      required:
      - bookingNumber
      - full
      - modality
      - shippingCompany
      - sizeType
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/HandlingData'
      - type: object
        properties:
          inlandTerminal:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/InlandTerminal'
          transportNumber:
            maxLength: 35
            minLength: 0
            type: string
            description: Customer's ref number of the hinterland transport.
            nullable: true
    CreateHandling:
      required:
      - handlingData
      - preNotification
      - visitId
      type: object
      properties:
        visitId:
          type: string
          description: Unique identifier of the visit which was generated on the creation of the visit
          example: '75111204'
        handlingData:
          allOf:
          - $ref: '#/components/schemas/HandlingData'
        preNotification:
          type: boolean
          description: Indication whether a pre-announcement (true) or a status request (when supported by the terminal for the given modality) must be send to the terminal (false). Status request on a visit not supported for Road.
    DangerousGood:
      required:
      - hazardClass
      - unCode
      type: object
      properties:
        unCode:
          type: string
          description: The UN code of the container good
          example: '1150'
        hazardClass:
          type: string
          description: The IMO hazard class of the container good
          example: '1'
        gevi:
          type: string
          description: The hazard identification number of the container good
          nullable: true
          example: X839
        limitedQuantity:
          type: string
          description: Limited Quantities are dangerous goods that have a reduced risk of harm when presented in smaller quantities (Yes/No)
          nullable: true
          example: 'Yes'
        packingGroup:
          type: string
          description: The packing group is a grouping according to the degree of danger presented by hazardous materials or dangerous goods (I/II/III)
          nullable: true
          example: I
        description:
          type: string
          description: Description of this dangerous good
          nullable: true
          example: Articles containing a pyrotechnic substance.
      description: Dangerous goods information for the container
    DeepSeaReference:
      type: object
      properties:
        shipName:
          type: string
          nullable: true
        imoCode:
          type: string
          nullable: true
        crnNumber:
          type: string
          nullable: true
    HandlingData:
      required:
      - bookingNumber
      - full
      - modality
      - shippingCompany
      - sizeType
      - type
      type: object
      properties:
        equipmentNumber:
          maxLength: 11
          minLength: 0
          type: string
          description: Required except for loading empty and depending on terminal setting `lossenOpRichtlijnAllowed`. <br>Unique identifier of the container.
          nullable: true
          example: BICU1234565
        weight:
          maximum: 99999
          minimum: 0
          type: number
          description: Required depending on terminal setting. <br>The weight of the cargo in kilograms meaning the tare weight of the container excluded.
          nullable: true
        tareWeight:
          maximum: 99999
          minimum: 0
          type: number
          description: The weight of the container itself in kilograms without the weight of the cargo.
          nullable: true
        sealNumber:
          type: string
          description: Required depending on terminal setting and max length depending on terminal. <br>The identification number of the container seal.
          nullable: true
        reefer:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Reefer'
        outOfGauge:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OutOfGauge'
        bookingNumber:
          maxLength: 35
          minLength: 0
          type: string
          description: The delivery ref for discharge or the release reference (pin code) for loading of the container at the terminal.
        shippingCompany:
          allOf:
          - $ref: '#/components/schemas/ShippingCompany'
        sizeType:
          allOf:
          - $ref: '#/components/schemas/SizeType'
        type:
          type: string
          description: Indication whether the container is loaded onto or unloaded from the hinterland means of transport.
          enum:
          - loading
          - discharge
        full:
          type: boolean
          description: Indication whether the container is full or empty.
        shippersOwned:
          type: boolean
          description: Indication whether the container identifier is a ISO 6346 compliant container number (apply true when it does not comply).
        humidity:
          type: number
          description: '`Integral planning` The humidity for this container in percentage.'
          nullable: true
        doorOpen:
          type: boolean
          description: '`Integral planning` Indicates whether the door for this container is open.'
          nullable: true
        chainWork:
          type: boolean
          description: '`Integral planning` Indicates whether chains are needed to load or discharge this container.'
          nullable: true
        generator:
          type: boolean
          description: '`Integral planning` Indicates whether this container has a generator.'
          nullable: true
        damageRemark:
          type: string
          description: '`Integral planning` Can be used to communicate detected damage to the container.'
          nullable: true
        previousPort:
          type: string
          description: '`Integral planning` The code of the port this container departed from before arriving at Rotterdam.'
          nullable: true
        remarks:
          type: string
          description: Remarks regarding this container.
          nullable: true
          example: Connected reefer
        category:
          type: string
          description: '`Integral planning` The category of the container, free text, for example ‘food grade’.'
          nullable: true
        nextPort:
          type: string
          description: '`Integral planning` The code of the port this container will be shipped to after departing from Rotterdam. Only for export containers (discharging).'
          nullable: true
        finalPort:
          type: string
          description: '`Integral planning` The code of the port which is the final destination for this container, after departing from Rotterdam. Only for export containers (discharging).'
          nullable: true
        dangerousGoods:
          type: array
          description: The specification of dangerous goods in this container
          items:
            $ref: '#/components/schemas/DangerousGood'
        consignmentNumber:
          type: string
          description: The unique transport document number from the Bill of Lading, used to identify and associate this container with its corresponding shipment
          nullable: true
        totalContainerWeight:
          type: number
          description: The total weight of the container, meaning the 'weight' and the 'tareWeight' added.
          nullable: true
        modality:
          type: string
          description: The way in which the transportation of the cargo takes place in the hinterland.
          example: barge
          enum:
          - road
          - rail
          - barge
          - cer
          - sea
        deepSea:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/DeepSeaReference'
      description: 'Cargo handling details as requested by the declarant for the given modality. '
      discriminator:
        propertyName: modality
        mapping:
          barge: '#/components/schemas/BargeHandlingData'
          road: '#/components/schemas/RoadHandlingData'
          rail: '#/components/schemas/RailHandlingData'
    InlandTerminal:
      type: object
      properties:
        name:
          maxLength: 25
          minLength: 0
          type: string
          description: The name of the inland terminal, preferably the BICS code.
          nullable: true
        location:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Location'
      description: Location is required for loading for modality Rail and Barge.<br>The domestic terminal or the terminal in the hinterland at which the import container is delivered.
    Location:
      required:
      - locationUnCode
      type: object
      properties:
        name:
          type: string
          description: The name of the location
          nullable: true
        locationUnCode:
          maxLength: 5
          minLength: 0
          type: string
          description: UN/LOCODE; the United Nations Code for Trade and Transport Locations of the location
      description: Use a location retrieved with find locations via the Reference Data API wiht the operation [findLocations](#operation/_05_findLocations).
    OutOfGauge:
      type: object
      properties:
        left:
          maximum: 99999
          minimum: 0
          type: integer
          format: int32
          nullable: true
        front:
          maximum: 99999
          minimum: 0
          type: integer
          format: int32
          nullable: true
        height:
          maximum: 99999
          minimum: 0
          type: integer
          format: int32
          nullable: true
        right:
          maximum: 99999
          minimum: 0
          type: integer
          format: int32
          nullable: true
        rear:
          maximum: 99999
          minimum: 0
          type: integer
          format: int32
          nullable: true
      description: Required depending on terminal setting.<br>The number of centimeters on which the cargo exceeds the dimensions of the container.
    RailHandlingData:
      required:
      - bookingNumber
      - full
      - modality
      - shippingCompany
      - sizeType
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/HandlingData'
      - type: object
        properties:
          transportNumber:
            maxLength: 17
            minLength: 0
            type: string
            description: Customer's ref number of the hinterland transport.
            nullable: true
          inlandTerminal:
            title: ''
            type: ''
            description: The location of the inland terminal where the cargo will be discharged.
            nullable: true
            deprecated: false
            allOf:
            - $ref: '#/components/schemas/Location'
          finalDestination:
            title: ''
            type: ''
            description: The final destination of the container.
            nullable: true
            deprecated: false
            allOf:
            - $ref: '#/components/schemas/Location'
          interTerminalTransportLocation:
            title: ''
            type: ''
            description: Terminal for inter-terminal transport, validated by PCS. Only one of the fields is required
            nullable: true
            deprecated: false
            allOf:
            - $ref: '#/components/schemas/GetRailInterTerminal'
          railServiceCenterCode:
            maxLength: 35
            minLength: 0
            type: string
            description: Terminal codes used by RSC to signify inter-terminal transport. These codes are not known by PCS or validated by PCS, but are validated by the terminals themselves.
            nullable: true
    Reefer:
      type: object
      properties:
        temperatureFixed:
          type: boolean
          description: Indication whether the cooling system of the container must be set to a constant temperature.
          nullable: true
        temperature:
          maximum: 999
          minimum: -999
          type: number
          description: The constant number of degrees Celsius on which the cooling system must be set.
          nullable: true
        minimumTemperature:
          maximum: 999
          minimum: -999
          type: number
          description: The lower bound of the number of degrees Celsius on which the cooling system must be set.
          nullable: true
        maximumTemperature:
          maximum: 999
          minimum: -999
          type: number
          description: The upper bound of the number of degrees Celsius on which the cooling system must be set.
          nullable: true
      description: Required depending on terminal setting.<br>Containing the refrigerated container details.
    RoadHandlingData:
      required:
      - bookingNumber
      - full
      - modality
      - shippingCompany
      - sizeType
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/HandlingData'
      - type: object
        properties:
          transportNumber:
            maxLength: 35
            minLength: 0
            type: string
            description: Customer's ref number of the hinterland transport.
            nullable: true
          cmr:
            type: string
            description: e-CMR of the hinterland transport. This field is currently in pilot phase and only applicable for a limited number of terminals.
            nullable: true
    ShippingCompany:
      required:
      - name
      - scacCode
      type: object
      properties:
        name:
          type: string
          description: The name of the shipping company.
        scacCode:
          maxLength: 4
          minLength: 0
          type: string
          description: The Standard Carrier Alpha Code (SCAC) which is a privately controlled US code used as identifier for the shipping company.
        smdgCode:
          maxLength: 3
          minLength: 0
          type: string
          description: The identifier of the shipping company, issued by the SMDG.
          nullable: true
      description: 'Also called carrier (dutch: rederij). The organisation that arranges the transport of the goods.<br>Use a carrier retrieved with find carriers via the ref Data API.. Two fields required'
    SizeType:
      required:
      - code
      type: object
      properties:
        code:
          maxLength: 4
          minLength: 0
          type: string
          description: The coded container's length, width, height, type and features.
          example: 22G1
        name:
          type: string
          description: The descriptive name of the size type of container as specified with the code.
          nullable: true
          readOnly: true
          example: 20'x8'x8'6\" General Purpose Container
      description: The classification of the container's length, width, height, type and features.<br>Use a size type retrieved with find size types via the Reference Data API '[Find SizeTypes](#operation/_06_findSizeTypes)'.
    UpdateHandling:
      required:
      - handlingData
      - handlingId
      - preNotification
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
        handlingData:
          title: ''
          type: ''
          description: The cargo handling details according to the declarant.
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/HandlingData'
        preNotification:
          type: boolean
          description: Indication whether a pre-announcement (true) or a status request (when supported by the terminal for the given modality) must be send to the terminal (false). Status request on a visit not supported for Road.
        visitId:
          type: string
          description: 'Unique identifier of the visit which was generated on the creation of the visit. <br>If given, the update will work even if the handling has been detached. '
          nullable: true
          example: '75111204'
    DetachHandling:
      required:
      - handlingId
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
          example: d7727b42-b7d3-490e-aa70-619d7717b1d1
    CancelAndDetachHandling:
      required:
      - handlingId
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
          example: d7727b42-b7d3-490e-aa70-619d7717b1d1
        cancelReason:
          type: string
          nullable: true
    MoveHandling:
      required:
      - handlingId
      - nextVisitId
      - nextVoyageId
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
          example: d7727b42-b7d3-490e-aa70-619d7717b1d1
        nextVisitId:
          type: string
          description: Unique identification of the visit to which the cargo handling must move.
        nextVoyageId:
          type: string
          description: Unique identification of the voyage related to the visit to which the cargo handling must move.
        preNotification:
          type: boolean
          description: Indication whether a pre-announcement (true) or a status request (when supported by the terminal for the given modality) must be send to the terminal (false). Status request on a visit not supported for Road.
        handlingData:
          title: ''
          type: ''
          description: Optional to update handling data while moving handling to a another visit
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/HandlingData'
    CreateDetachedHandling:
      required:
      - handlingData
      - terminal
      type: object
      properties:
        terminal:
          title: ''
          type: ''
          description: The terminal location at which the container will be loaded or discharged.<br>Terminal must support the given modality.<br>Please refer to Reference Data API '[Get terminals](#operation/_08_getTerminals)' to get a list of known Terminals and its attributes.<br>Only one subfield is required.
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/GetTerminal'
        handlingData:
          allOf:
          - $ref: '#/components/schemas/HandlingData'
        eta:
          type: string
          description: The expected time of arrival of the means of hinterland's transport at the terminal.
          format: date-time
          nullable: true
    UpdateDetachedHandling:
      required:
      - handlingData
      - handlingId
      type: object
      properties:
        handlingId:
          type: string
          description: Unique identifier of the handling/container which was generated on the creation of the handling.
          example: d7727b42-b7d3-490e-aa70-619d7717b1d1
        terminal:
          title: ''
          type: ''
          description: The terminal location at which the container will be loaded or discharged.<br>Terminal must support the given modality.<br>Please refer to Reference Data API '[Get terminals](#operation/_08_getTerminals)' to get a list of known Terminals and its attributes.<br>Only one subfield is required.
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/GetTerminal'
        handlingData:
          allOf:
          - $ref: '#/components/schemas/HandlingData'
        eta:
          type: string
          description: The expected time of arrival of the means of hinterland's transport at the terminal.
          format: date-time
          nullable: true
    AcceptStatus:
      type: object
      properties:
        type:
          type: string
          description: Broad categories of accept statuses. We categorize most accept codes under these types. When we cannot match a code to a type, we leave the type empty (null).<br><br>CARGO_OPENING and BOOKING_APPROVED are never applicable to loading.<br><br>AVAILABLE and COMMERCIAL_RELEASE are never applicable to discharge.
          nullable: true
          enum:
          - AVAILABLE
          - BOOKING_APPROVED
          - COMMERCIAL_RELEASE
          - CUSTOMS_DOCUMENT
          - BLOCKED
          - SIZETYPE_APPROVED
          - CARGO_OPENING
        ok:
          type: boolean
          description: Indicates whether this type of accept status is unknown (null), ok (true) or not ok (false).
          nullable: true
        code:
          type: string
          description: The warning code that is sent by the terminal.
          nullable: true
        remark:
          type: string
          description: The optional remark sent by the terminal.
          nullable: true
    ApiDetachedHandling:
      required:
      - declarant
      - handlingData
      - handlingId
      - terminal
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/ApiModel'
      - type: object
        properties:
          handlingId:
            type: string
          modality:
            type: string
            nullable: true
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
          declarant:
            allOf:
            - $ref: '#/components/schemas/HinterlandOrganisation'
          handlingData:
            allOf:
            - $ref: '#/components/schemas/HandlingData'
          handlingStatus:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/HandlingStatus'
          eta:
            type: string
            format: date-time
            nullable: true
          cancelled:
            type: boolean
          attached:
            type: boolean
          handlingDeclaration:
            title: ''
            type: ''
            description: The latest handling declaration
            nullable: true
            deprecated: false
            allOf:
            - $ref: '#/components/schemas/ApiHandlingDeclaration'
          terminal:
            allOf:
            - $ref: '#/components/schemas/Terminal'
          bookingNumberSource:
            type: string
            description: Source of the booking number. OPERATOR in case the pin code is provided by the operator, CARGO_DIRECTOR in case the pin code is provided by the client (no secure chain), COMMERCIAL_RELEASE in case the pin code is provided by secure chain release
            nullable: true
            enum:
            - COMMERCIAL_RELEASE
            - CARGO_DIRECTOR
            - OPERATOR
          deepSea:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/DeepSea'
          shipment:
            title: ''
            type: ''
            description: Container shipment data associated with this handling.
            nullable: true
            deprecated: false
            allOf:
            - $ref: '#/components/schemas/Shipment'
    ApiHandlingDeclaration:
      type: object
      properties:
        declarationUsingUpdateBypass:
          type: boolean
          description: Indicating whether the handling declaration is using the update by-pass. Depends on the terminal property `handlingUpdateBypassAllowed`
        cancelForUpdateByPassAcceptedByTerminal:
          type: boolean
          description: Indicating whether the cancel before the update is accepted by the terminal not supporting updates. See `declarationUsingUpdateBypass` and terminal property `handlingUpdateBypassAllowed`
        status:
          type: string
          nullable: true
          enum:
          - DECLARED
          - REJECTED
          - ACCEPTED
        acceptStatuses:
          type: array
          items:
            $ref: '#/components/schemas/AcceptStatus'
        rejectReasons:
          type: array
          items:
            $ref: '#/components/schemas/TerminalRejectReason'
      description: The latest handling declaration
    BargeVessel:
      required:
      - europeId
      - name
      type: object
      allOf:
      - $ref: '#/components/schemas/CargoVessel'
      - type: object
        properties:
          name:
            maxLength: 35
            minLength: 0
            type: string
            description: The name of the barge.
            readOnly: true
            example: GOUDVIS
          europeId:
            maxLength: 11
            minLength: 0
            type: string
            description: The ENI number (European Number of Identification or European Vessel Identification Number) which is a registration for the barge, which is capable of navigating on inland European waters. It is a unique identifier that is attached to a hull for its entire lifetime, independent of the vessel's current name or flag.
            example: 06105081
          flagCode:
            maxLength: 3
            minLength: 0
            type: string
            description: The nationality of the barge.
            nullable: true
            readOnly: true
            example: NLD
          teuCapacity:
            minimum: 0
            type: integer
            description: '`Integral planning` The maximum physical amount of TEU that can fit on the barge.'
            format: int32
            nullable: true
            readOnly: true
            example: 200
          mmsi:
            maxLength: 9
            minLength: 0
            type: string
            description: '`Integral planning` The Maritime Mobile Service Identity (MMSI) to identify a ship as used by i.e. AIS (Automatic Identification System).'
            nullable: true
            readOnly: true
            example: '244790279'
          length:
            type: number
            description: '`Integral planning` The barge length in meters. Value between 35 and 250.'
            nullable: true
            readOnly: true
            example: 110
          width:
            type: number
            description: '`Integral planning` The barge width in meters. Value between 5 and 40.'
            nullable: true
            readOnly: true
            example: 26
          downStreamSpeed:
            type: number
            description: '`Integral planning` Average speed of the barge when loaded from hinterland in km/h. Value between 5 and 30.'
            nullable: true
            readOnly: true
            example: 23
          upstreamSpeed:
            type: number
            description: '`Integral planning` Average speed of the barge when empty to the hinterland in km/h. Value between 5 and 30.'
            nullable: true
            readOnly: true
            example: 23
          canBeHandledByNrOfCranes:
            maximum: 5
            minimum: 1
            type: integer
            description: '`Integral planning` The number of cranes that can simultaneously load/discharge the ship.'
            format: int32
            nullable: true
            readOnly: true
            example: 2
    CargoCurrency:
