      type: object
      properties:
        voyageId:
          type: string
          description: Unique identifier of the voyage which was generated on the creation of the voyage
        restrictions:
          type: array
          description: '`Integral planning` An ordered sequence of restriction groups for this barge voyage. The planner must handle all visits in the first group before moving on to the second group, and so on. Within each group, the logicalOperator determines whether all visits must be done (''and'') or just one (''or'').'
