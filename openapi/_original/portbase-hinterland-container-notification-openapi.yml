  /listen/shipments:
    post:
      tags:
      - Tracking API
      summary: Listen to shipment updates
      description: 'Listen in real-time to shipment updates.


        In order to achieve real-time updates, the api uses long polling.

        When you send the api request to `/listen/shipments`, you will immediately receive any update that has happened since your previous call,

        up to the number configured with the maxSize attribute.

        If no updates have happened since your previous call, the api request will not return immediately.

        The request will return when a new update has become available or when the maxTimeout is reached.

        After the api response has returned, and the client has finished processing the updates, you should always call the `/updatePosition` api, immediately followed by a call to `/listen/shipments`.

        By calling `/listen/shipments` again for the next update batch, this turns into a continuous process so that we can guarantee a quick response with real-time updates.

        With this setup, you will receive updates as fast as you can process them.


        ## Usage

        Using the Tracking API should be a continuous process, running 24/7, looping through the following sequence of API calls

        1. Call `/listen/shipments`

        2. Process the updates that were returned

        3. Immediately after 2., call `/updatePosition` when done with your updates (even if the /listen response was empty, the index was null etc.)

        4. Keep repeating 1 and 2

        5. When your process needs to stop, restart or redeploy, call `/disconnectClient`


        **Important:**

        - Implement this as a continuous loop where `/listen` is called immediately after `/updatePosition`. Do not use scheduled tasks (cron jobs), as this causes updates to accumulate faster than they can be processed, preventing real-time tracking.

        - Keep the timeout as high as possible (we recommend the default of 95000 ms). Results are returned immediately when available, but a higher timeout reduces connection overhead when updates are less frequent.'
      operationId: _06_listen
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetShipmentUpdates'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentUpdateBatch'
  /visits:send:
    post:
      tags:
