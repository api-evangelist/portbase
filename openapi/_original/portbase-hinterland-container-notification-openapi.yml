    HinterlandUpdateBatch:
      type: object
      properties:
        lastIndex:
          type: integer
          description: Returns the index of the last update sent to the client. If the client has successfully processed the updates in this api response, it should send this lastIndex value in its request to `/updatePosition`. If no request to `/updatePosition` is made before the next request to `/listen` the same updates will be received again.
          format: int64
          nullable: true
        clientSegment:
          maxItems: 2
          minItems: 2
          type: array
          description: Returns the segment of messages that is allocated to the client. The start value is inclusive, the end value is exclusive. There are 128 segments. A clientSegment return value of [0,128] means that this client is receiving updates for all the segments. A return value of [64,128] means this client is receiving updates for the segments 64 (inclusive) to 128 (exclusive). Use this value in the request to `/updatePosition` after the updates have been processed successfully.
          nullable: true
          items:
            type: integer
            description: Returns the segment of messages that is allocated to the client. The start value is inclusive, the end value is exclusive. There are 128 segments. A clientSegment return value of [0,128] means that this client is receiving updates for all the segments. A return value of [64,128] means this client is receiving updates for the segments 64 (inclusive) to 128 (exclusive). Use this value in the request to `/updatePosition` after the updates have been processed successfully.
            format: int32
