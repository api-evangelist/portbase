      description: 'The information about the cargo.

        When sending the data to MCA there are two options:


        1. If the container is loaded or discharged, there should be a `handlingId` that is available to you: send that identifier. MCA will automatically fill equipment details.

        2. If the container will remain on the train, you do not have a handlingId. Send the four properties `equipmentNumber`, `sizeType`, `full`, ''grossWeight''.

        '
    PlannedCargo:
