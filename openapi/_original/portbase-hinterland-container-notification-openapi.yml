    LegacyRestriction:
      required:
      - visitIds
      type: object
      properties:
        visitIds:
          type: array
          description: A list of groups of visit ids. Integral planning will always first plan all the visits in the first group, then the visits in the second group, etcetera. However, integral planning will still shuffle the order of the visits within each group.
          items:
            type: array
            description: A list of groups of visit ids. Integral planning will always first plan all the visits in the first group, then the visits in the second group, etcetera. However, integral planning will still shuffle the order of the visits within each group.
            items:
              type: string
              description: A list of groups of visit ids. Integral planning will always first plan all the visits in the first group, then the visits in the second group, etcetera. However, integral planning will still shuffle the order of the visits within each group.
              nullable: true
        transportingReefers:
          type: boolean
          description: If the restriction is due to transporting reefers, then integral planning will not change visit times.
      description: '`Integral planning` Forces the order of visits or groups of visits to remain a certain way.'
    UpdateRestrictions:
      required:
      - restrictions
      - voyageId
      type: object
      properties:
        voyageId:
          type: string
          description: Unique identifier of the voyage which was generated on the creation of the voyage
        restrictions:
          type: array
          description: '`Integral planning` Forces the order of visits or groups of visits to remain a certain way.'
          items:
            $ref: '#/components/schemas/LegacyRestriction'
    BargeVoyageRestrictionGroup:
      required:
      - visitIds
      type: object
      properties:
        visitIds:
          type: array
          description: The visit ids that form this group.
          items:
            type: string
            description: The visit ids that form this group.
            nullable: true
        logicalOperator:
          type: string
          description: How the visit ids within this group are evaluated by the planner. 'and' means all visits in the group must be done; 'or' means any one visit in the group suffices. Only required when the group contains more than one visit id; omit or leave null for single-visit groups. Where a logicalOperator is used and transportingReefers is true, only 'and' is supported.
          nullable: true
          enum:
          - and
          - or
      description: A group of visit ids that the planner must treat as a unit within the ordered sequence of restriction groups. The sequence defines the order in which groups must be planned. Within a group, the logicalOperator determines whether all visits must be done ('and') or just one ('or').
    RestrictionGroupsEntry:
      required:
      - restrictionGroups
      type: object
      properties:
        restrictionGroups:
          type: array
          description: A list of restriction groups, each with a logical operator ('and' or 'or').
          items:
            $ref: '#/components/schemas/BargeVoyageRestrictionGroup'
        transportingReefers:
          type: boolean
          description: If the restriction is due to transporting reefers, then integral planning will not change visit times.
      description: '`Integral planning` An ordered sequence of restriction groups for this barge voyage. The planner must handle all visits in the first group before moving on to the second group, and so on. Within each group, the logicalOperator determines whether all visits must be done (''and'') or just one (''or'').'
    UpdateRestrictionGroups:
      required:
