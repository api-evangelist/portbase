    BargeVoyageRestriction:
      type: object
      properties:
        visitIds:
          type: array
          description: A list of groups of visit ids. Integral planning will always first plan all the visits in the first group, then the visits in the second group, etcetera. However, integral planning will still shuffle the order of the visits within each group. Used by the legacy restrictions endpoint.
          items:
            type: array
            description: A list of groups of visit ids. Integral planning will always first plan all the visits in the first group, then the visits in the second group, etcetera. However, integral planning will still shuffle the order of the visits within each group. Used by the legacy restrictions endpoint.
            items:
              type: string
              description: A list of groups of visit ids. Integral planning will always first plan all the visits in the first group, then the visits in the second group, etcetera. However, integral planning will still shuffle the order of the visits within each group. Used by the legacy restrictions endpoint.
              nullable: true
        restrictionGroups:
          type: array
          description: A list of restriction groups, each with a logical operator ('and' or 'or'). Integral planning will always first plan all the visits in the first group, then the visits in the second group, etcetera. However, integral planning will still shuffle the order of the visits within each group. Used by the restriction groups endpoint.
          items:
            $ref: '#/components/schemas/BargeVoyageRestrictionGroup'
        transportingReefers:
          type: boolean
          description: If the restriction is due to transporting reefers, then integral planning will not change visit times.
      description: '`Integral planning` Forces the order of visits or groups of visits to remain a certain way.'
