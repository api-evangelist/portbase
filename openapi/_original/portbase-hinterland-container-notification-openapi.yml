          nullable: true
        overheight:
          type: number
          nullable: true
        overwidth:
          type: number
          nullable: true
        oversizeRemarks:
          type: string
          nullable: true
      description: The shipped item.
    CargoLocation:
      type: object
      properties:
        unLocation:
          nullable: true
