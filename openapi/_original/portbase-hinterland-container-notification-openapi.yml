- name: Tracking API
  description: "This API can be used to receive **real-time** updates about the voyages, visits and (detached) handlings. \nTo achieve these real-time updates the API uses a mechanism called 'long polling'.\nWhen you send a request to listen for updates, you will receive an update immediately when it happened since your last request. \nOr when there is no update, it will wait until there is, or timeout when the maxTimeout you specified is reached.\nAfter the api response has returned, and your client has finished processing the updates, you should always update your position. \nThis way the next time you ask for updates, the API will look for updates after that position in the event log.\nThis mechanism also enables batching, since you will receive all updates as fast as you can process them.\n\nImportant to realize is that you will receive updates with a _before_ and _after_ situation in which only the changes are incorporated. \nSo when only one handling is changed, you will receive only\
    \ that handling within the visit within the voyage and not all containers and visits!\nThe same per-item delta applies to the `trainLocationReports` on a rail voyage: each update contains only the reports that were added or changed, not the reports you already received in earlier updates.\n\n## Usage\nUsing the Tracking API should be a continuous process, running 24/7, looping through the following sequence of API calls\n1. Call `/listen`\n2. Process the updates that were returned\n3. Immediately after 2., call `/updatePosition` when done with your updates (even if the `/listen` response was empty, the index was null etc.)\n4. Keep repeating step 1-3\n5. When your process needs to stop, restart or redeploy, call `/disconnectClient`\n\n**Important:** \n- Implement this as a continuous loop where `/listen` is called immediately after `/updatePosition`. Do not use scheduled tasks (cron jobs), as this causes updates to accumulate faster than they can be processed, preventing real-time tracking.\
    \    \n- Keep the timeout as high as possible (we recommend the default of 95000 ms). Results are returned immediately when available, but a higher timeout reduces connection overhead when updates are less frequent.\n\n\nDisconnecting the client makes sure that other connecting clients will receive the updates that were meant for this client. That is because you can connect multiple clients and each client is assigned a segment (range). Updates for a voyage will always be handled by the same segment. So when you do not disconnect your client, the other connected clients will not receive the updates for your segment(s) for a while. After a while when a client does not ask for updates, those segments are released to the other client(s).\n\n## Things to consider when receiving updates\nIn some situations you may receive multiple updates for one logical change. This happens when the change involves two voyages or a voyage and a detached handling. The order in which the updates for the different\
    \ entities are received is not guaranteed. \nThis may pose a challenge, depending on the structure of the data model used on the client side. The following sections describe the situations where this can occur and how to mitigate challenges caused by out-of-order updates.\n\n### 1. A handling was attached\nAttaching a detached handling to a visit or voyage will result in two updates: \n- The detached handling will be marked as attached (`attached=true`)\n- The handling will appear as a new item in the array of handlings of the visit.\n\nIf your data model only has a single copy of a handling (i.e. it does not store attached and detached handlings separately), then ignore the update of the detached handling and only process the update of the visit the handling was attached to.\nSubsequent updates of the handling will appear on the now attached handling on the visit.\n\n### 2. A handling was detached\nDetaching a handling from a visit or voyage will result in two updates: \n- The handling\
    \ will be marked as detached (`attached=false`)\n- The handling will disappear from the array of handlings of the visit it was attached to.\n\nIf your data model only has a single copy of a handling (i.e. it does not store attached and detached handlings separately), then ignore the update of the visit the handling was detached from and only process the update/creation of the detached handling.\nSubsequent updates of the handling will appear on the now detached handling.\n\n### 3. A handling was moved\nMoving a handling from one visit to another visit in a different voyage will result in two updates:\n- The handling will disappear from the array of handlings of the visit it was previously attached to.\n- The handling will appear as a new item in the array of handlings of the visit it's moved to\n\nAs mentioned earlier, these updates may be received out-of-order. If your data model only has a single copy of a handling (i.e. it does not store a copy per visit it is attached to) then the\
    \ handling may end up in the wrong state (not attached to any visit). \nTo prevent this:\n- Ignore updates where a handling is removed from a visit it is not attached to according to your data model.\n- Process updates where a handling is attached to a visit, even though the handling is attached to another visit according to your data model\n\nSubsequent updates of the handling will appear on the visit it was moved to.\n\n### 4. A visit was moved\nThis scenario is almost identical to the previous one, where a handling was moved to a visit of another voyage. The difference is that in this case the voyage data is changed, such as the transportation vehicle, instead of the visit data. \nThe challenges in this scenario are also similar and the same strategies to mitigate them should be followed. \nSubsequent updates of handlings will appear on the voyage the visit was moved to."
- name: Integral Planning API
  description: This endpoint can be used by the integral planner Nextlogic to update the planning information.
- name: Operator API - handlings
  description: API for the declarant to create, update, move, detach or cancel attached handlings (handlings that are connected to a visit and voyage).
- name: Operator API - visits
  description: Endpoint to create new visits by a declarant, update, move or cancel them. A special operation to indicate the load-discharge list is finalized is also available, to let the terminal know that after reopening the load-discharge list after cut-off time, you are done with adding/removing handlings.
- name: Operator API - voyages
  description: API for the declarant to create new voyages, update or cancel them. Special operations are also available to indicate that the voyage contains visits where restrictions apply (i.e. due to reefers).
- name: Organisation Data API
  description: Api defining the operations a terminal/barge operator can do to retrieve organisation configuration. Basically these operations retrieve configuration data such as bollards, fixedwindows etc.
- name: Reference Data API
  description: Portbase uses reference data within the API calls for instance barges, shipping companies, container sizetypes etc. With this Reference Data API you can retrieve the data to be used in the API calls for voyages, visits and handlings. This way you make sure you do not send unknown or invalid information.
- name: Terminal API - handlings
  description: Api defining the operations a terminal can do for handlings. Basically these operations supply feedback to the declarant about the status of the handling.
- name: Terminal API - visits
  description: Api defining the operations a terminal can do to respond on visit requests from the declarant. The terminal supplies feedback if a visit is accepted and can be planned, rejected or completed.
paths:
  /handlings:accept:
    post:
      tags:
      - Terminal API - handlings
      summary: Accept handling
      description: This endpoint can be used to accept a handling and send feedback about the status of this handling. For a container to be regarded as **green**, you can send an empty list of statusses. When a code is submitted, this means there is something wrong with the handling that needs to be fixed before a terminal can accept the handling. All allowed codes:<table><tr><th>code</th><th>description</th><th>AcceptStatus</th><th>Applicable to</th></tr><tr><td>BLA</td><td>Blocked by shipping line</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLB</td><td>Blocked by security</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLC</td><td>Blocked due to customs</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLD</td><td>Blocked by fire brigade</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLI</td><td>Blocked by inspection</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLN</td><td>Blocked due to difference in container number
        between delivery order and physical container</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLP</td><td>Blocked by police</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLT</td><td>Blocked by terminal</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>CDM</td><td>Customs documents missing</td><td>CUSTOMS_DOCUMENT</td><td>Loading / Discharge</td></tr><tr><td>COA</td><td>Container not available</td><td>AVAILABLE</td><td>Loading</td></tr><tr><td>BCO</td><td>Before cargo opening</td><td>CARGO_OPENING</td><td>Discharge</td></tr><tr><td>COR</td><td>Container not released<br>Booking status</td><td>COMMERCIAL_RELEASE</td><td>Loading</td></tr><tr><td>BON</td><td>Size/type</td><td>SIZETYPE_APPROVED</td><td>Loading / Discharge</td></tr><tr><td>ORN</td><td>Booking number unknown<br>Carrier/container lessor unknown</td><td>BOOKING_APPROVED</td><td>Discharge</td></tr><tr><td>QQQ</td><td>Conditionally accepted (all statuses unknown)</td><td>null</td><td>Loading
        / Discharge</td></tr><tr><td>COU</td><td>Container unknown (all statuses unknown)</td><td>null</td><td>Loading / Discharge</td></tr></table>
      operationId: _01_acceptHandling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptHandling'
      responses:
        '204':
          description: successful operation
  /visits:accept:
    post:
      tags:
      - Terminal API - visits
      summary: Accept visit
      description: This endpoint can be used to accept/plan a requested visit or update an already accepted/planned visit.
      operationId: _01_acceptVisit_Post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveVisit'
      responses:
        '204':
          description: successful operation
        '403':
          description: operation unsuccessful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalCommandException'
    patch:
      tags:
      - Terminal API - visits
      summary: Accept visit
      description: This endpoint can be used to update a previously accepted/planned visit. Only supplied properties will be updated. Any supplied properties with NULL values will delete existing values.
      operationId: _02_acceptVisit_Patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveVisit'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalVisitStatus'
        '403':
          description: operation unsuccessful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalCommandException'
