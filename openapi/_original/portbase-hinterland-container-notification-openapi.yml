          nullable: true
        portbaseDischargeId:
          type: string
          description: Portbase identifier for the discharge of the cargo off the vessel. Eg handling id in hinterland.
          nullable: true
        pickupStatus:
          title: ''
          type: ''
          description: Known terminal status for the pickup of the shipped cargo.
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/ContainerStatus'
        pickupReference:
          type: string
