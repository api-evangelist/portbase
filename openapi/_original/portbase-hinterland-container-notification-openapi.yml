          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/Party'
        portbaseVoyageId:
          type: string
          description: Id that unique identifies this movement in Portbase. Eg the call reference number of a sea movement.
          nullable: true
        transportReference:
          type: string
          description: Transport reference of the vessel operator for this movement.
          nullable: true
        terminalData:
          title: ''
          type: ''
          description: The handling data as reported by the terminal.
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/TerminalData'
        consignmentNumbers:
          uniqueItems: true
          type: array
          description: Consignment numbers for this shipment as registered by the operator.
          items:
            type: string
            description: Consignment numbers for this shipment as registered by the operator.
            nullable: true
        movementReferenceNumbers:
          type: array
          description: Identifiers from the government that describe this movement.
          items:
            type: string
            description: Identifiers from the government that describe this movement.
            nullable: true
        exchangeRate:
          title: ''
          type: ''
          description: Exchange rate against the Euro as agreed upon by parties when agreeing to move this cargo.
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/ExchangeRate'
        item:
          title: ''
          type: ''
          description: The shipped item.
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/CargoItem'
        shipperSealNumber:
          type: string
          description: Seal number registered by the named party.
          nullable: true
        carrierSealNumber:
          type: string
          description: Seal number registered by the named party.
          nullable: true
        customsSealNumber:
          type: string
          description: Seal number registered by the named party.
          nullable: true
        position:
          type: string
          description: Position of the cargo on board of the vessel during movement.
          nullable: true
        containerOperator:
          title: ''
          type: ''
          description: Party responsible for this shipment during this movement.
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/ShippingCompany'
        loading:
          type: string
          description: Timestamp of loading the cargo at the start of this movement.
          format: date-time
          nullable: true
        itinerary:
          type: array
          description: Itinerary of sea movement contains known stops made by the vessel on this movement, including for loading and discharging of the cargo. Itinerary of inland movement contains visit associated with handling and the final destination.
          items:
            $ref: '#/components/schemas/Stop'
        discharge:
          type: string
          description: Timestamp of discharging the cargo at the end of this movement.
          format: date-time
          nullable: true
        origin:
          title: ''
          type: ''
          description: Origin location of the cargo as reported by the operator (might be from before this movement).
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/Location'
        destination:
          title: ''
          type: ''
          description: Final destination of the cargo as reported by the operator (might be reached after this movement).
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/Location'
        portbaseLoadingId:
          type: string
