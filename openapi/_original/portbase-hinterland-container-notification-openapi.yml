info:
  title: Portbase hinterland api
  description: "## API Versions\nAPI version numbers are used to denote incompatible changes. Whenever an incompatible change is made to the API, the version number will be raised. Changes that are backwards compatible can be applied at any time. Past versions of the API will eventually become unsupported.\nAt present, the current version number of the API is 2, but versions 1 and 0 are still available as well. Not specifying a version number is equivalent to requesting version number 0. In the future, specifying a version number will become mandatory.\n\nA list of backwards incompatible changes can be found below.\n### Backwards incompatible changes in version 2\nNone\n\n## API Access\nAuthentication is based upon Basic Authentication, using special Portbase authentication headers.<br>Every api call requires the headers `Portbase-access-key-id` and `Portbase-secret-access-key`.\n\nTo obtain your access key, send an email to sales@portbase.com.\n\n## Notations used\nAll fields indicated\
    \ with type `date-time` are strings in ISO format, e.g. \"2019-12-04T18:40:59Z\".\n\nFields annotated with `Required for Integral planning` are required if integral planning is enabled by the barge operator.\n\n## Reference Data\nThe API calls contain references to Portbase reference data like Barges, Shipping companies, handling size types, terminals etc. \nTo supply the correct data, you can use the [Reference Data API](#tag/Reference-Data-API) to retrieve the values as known by Portbase.\n\n## Track updates\nTo receive real-time updates about changes on voyages, visit or handlings, the [Tracking API](#tag/Tracking-API) can be used. \nYou will receive small updates, which show the difference between the situation before and after (the so called delta). \nThis way the updates are kept small and you can focus on the changes that were made to keep you own systems up to date.\n\n## Error response format\nWhen a validation error occurs or any other error for that matter, the response returns\
    \ with the corresponding HTTP code and an errormessage in the following format:\n```json\n{\n  \"error\": \"message that indicates what the error was\"\n}\n```"
  contact:
    name: Portbase hinterland team
    url: https://hcn.pcs.portbase.com
    email: hinterland@portbase.com
  version: '2.0'
  x-logo:
    url: Portbase_WB_RGB.png
    altText: Portbase logo
