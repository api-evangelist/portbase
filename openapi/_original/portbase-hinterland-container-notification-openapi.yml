          description: The type of object that has been updated
          nullable: true
          enum:
          - VOYAGE
          - DETACHED_HANDLING
        triggeredByOrganisation:
          type: boolean
          description: Indicates if the update has been triggered by the same organisation as that of the recipient
        triggeredByUser:
          type: boolean
          description: Indicates if the update has been triggered by the listening user that is receiving the update
        triggeredByRecipient:
          type: boolean
          description: '`Deprecated` use `triggeredByOrganisation` instead'
          deprecated: true
    ShipmentError:
