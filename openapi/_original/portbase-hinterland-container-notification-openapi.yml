            description: The expected time of arrival at the entry point of the port.
            format: date-time
          etd:
            type: string
            description: The expected time of departure at the exit point of the port.
            format: date-time
            nullable: true
          teuOnArrival:
            minimum: 0
            type: integer
            description: '`Required for Integral planning` The estimated amount of loaded TEU on the barge when passing the entry point. Only count loaded TEU to be discharged at this port, do not include reserved TEU.'
            format: int32
            nullable: true
          reservedTeu:
            minimum: 0
            type: integer
            description: '`Required for Integral planning` The estimated amount of TEU reserved for other purposes. For instance, containers to be discharged at other ports or containers to be loaded in other ports. Reserved TEU will be ignored by integral planning.'
            format: int32
            nullable: true
          barge:
            title: ''
            type: ''
            description: The means of transport that is used for the inland transport of cargo by water
            deprecated: false
            allOf:
            - $ref: '#/components/schemas/Barge'
          additionalCapacity:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/AdditionalCapacity'
          planningNotBeforeEta:
            type: boolean
            description: '`Integral planning` Flag to indicate that a rotation cannot start before the given arrival date/time.'
            nullable: true
          entryPoint:
            title: ''
            type: ''
            description: The location at which the port visit starts. Also known as scope in. <br>Examples of know values are:<ul><li>BR - Brienenoordbrug</li><li>HT - Heinenoordtunnel</li><li>PS - Parksluizen</li></ul>. You can retrieve the possible values from the Reference Data API using getBargeAccessPoints.
            nullable: true
            deprecated: false
            allOf:
            - $ref: '#/components/schemas/BargeAccessPoint'
          exitPoint:
            title: ''
            type: ''
            description: The location at which the port visit ends. Also known as scope out.<br>Examples of know values are:<ul><li>BR - Brienenoordbrug</li><li>HT - Heinenoordtunnel</li><li>PS - Parksluizen</li></ul>. You can retrieve the possible values from the Reference Data API using getBargeAccessPoint.
            nullable: true
            deprecated: false
            allOf:
            - $ref: '#/components/schemas/BargeAccessPoint'
          staysInPort:
            type: boolean
            description: '`Integral planning` Flag to indicate that a rotation does not leave the port'
            nullable: true
          previousVoyageId:
            type: string
            description: '`Integral planning` When the barge does not leave port, instead of entering entrypoint, the previous voyage can be referenced.'
            nullable: true
