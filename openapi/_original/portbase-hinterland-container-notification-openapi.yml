          nullable: true
        expectedDischargeTime:
          type: string
          format: date-time
          nullable: true
        radioCallSign:
          type: string
          nullable: true
        shipsStayReference:
          type: string
          nullable: true
        cargoOpeningTime:
          type: string
          format: date-time
