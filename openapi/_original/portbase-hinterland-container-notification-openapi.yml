              $ref: '#/components/schemas/PlanVoyage'
      responses:
        '204':
          description: successful operation
  /processShipments:
    post:
      tags:
      - Forwarder API
      summary: Declare shipments
      description: This endpoint can be used to declare a batch of shipments and authorise operators. It is similar to /declareShipments but before declaring shipments it will look up all required reference data.
      operationId: _01_processShipments
      requestBody:
        content:
