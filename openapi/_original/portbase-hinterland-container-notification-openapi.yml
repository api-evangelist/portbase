    GetAllUpdates:
      required:
      - clientId
      type: object
      properties:
        clientId:
          type: string
          description: 'Identifies different clients within a consumer. So this is a unique id for your tracking client software, which you can choose yourself.

            Unless you want to loadbalance, send the same clientId in every API request.

            If you do wish to use multiple clients to loadbalance,

            each client should send a different clientId.

            Updates will be loadbalanced between the active clientIds.'
        maxSize:
          type: integer
          description: Limits the amount of updates received (nr of voyages / detached handlings / shipments) in each update batch. Default is 32.
          format: int32
          nullable: true
        maxTimeout:
          minimum: 10000
          type: integer
          description: 'Limits how long the request will wait for new updates (in milliseconds). Default, maximum and recommended is 95000 ms. IMPORTANT: If a result is found sooner, it will be returned immediately. A higher timeout reduces connection overhead when updates are less frequent, which is important for our performance.'
          format: int64
          nullable: true
          example: 95000
        version:
          maximum: 2
          minimum: 0
          type: integer
          description: Version of the Updates that will be received. Defaults to 0. Higher versions may include additional fields or structural changes to the response objects.
          format: int32
          nullable: true
    GetRoadVoyageUpdates:
      required:
      - clientId
      type: object
      properties:
        clientId:
          type: string
          description: 'Identifies different clients within a consumer. So this is a unique id for your tracking client software, which you can choose yourself.

            Unless you want to loadbalance, send the same clientId in every API request.

            If you do wish to use multiple clients to loadbalance,

            each client should send a different clientId.

            Updates will be loadbalanced between the active clientIds.'
          example: bcaa65b6-356f-4582-9947-8cb3aa7e0716
        maxSize:
          type: integer
          description: Limits the amount of updates received (nr of road voyages) in each update batch. Default is 32.
          format: int32
          nullable: true
          example: 100
        maxTimeout:
          minimum: 1000
          type: integer
          description: 'Limits how long the request will wait for new updates (in milliseconds). Default, maximum and recommended is 95000 ms. IMPORTANT: If a result is found sooner, it will be returned immediately. A higher timeout reduces connection overhead when updates are less frequent, which is important for our performance. Also, due to performance reasons, we will soft-cap the minimum maxTimeout at 10s: please consider 10s the lowest allowed amount. In the future we plan on raising this lower validation limit as well, so this soft-cap is reflected in the validation limits again.'
          format: int64
          nullable: true
          example: 95000
        version:
          maximum: 2
          minimum: 0
          type: integer
          description: Version of the Updates that will be received. Defaults to 0. Higher versions may include additional fields or structural changes to the response objects.
          format: int32
          nullable: true
        pathFilters:
          type: array
          description: '**OPTIONAL:** JSON paths to monitor for changes using RFC 6901 JSON Pointer notation. When specified, updates are only sent when values at these paths change. This allows clients to reduce bandwidth by filtering out irrelevant updates. **This is an optional feature - if not specified, all updates are sent.**


            **Examples:** `/voyageStatus`, `/voyageData/truckLicenseId`, `/visits`


            **Limitations:**

            - Path filters apply to the entire voyage object

            - Filtering on nested visit or handling properties requires filtering on the parent collection (e.g., `/visits`)

            - Cannot filter on specific array elements by ID, only on the entire collection

            - If null or empty, all updates are sent regardless of what changed'
          example:
          - /voyageStatus
          - /voyageData/truckLicenseId
          - /visits
          items:
            type: string
            description: '**OPTIONAL:** JSON paths to monitor for changes using RFC 6901 JSON Pointer notation. When specified, updates are only sent when values at these paths change. This allows clients to reduce bandwidth by filtering out irrelevant updates. **This is an optional feature - if not specified, all updates are sent.**


              **Examples:** `/voyageStatus`, `/voyageData/truckLicenseId`, `/visits`


              **Limitations:**

              - Path filters apply to the entire voyage object

              - Filtering on nested visit or handling properties requires filtering on the parent collection (e.g., `/visits`)

              - Cannot filter on specific array elements by ID, only on the entire collection

              - If null or empty, all updates are sent regardless of what changed'
            nullable: true
            example: '["/voyageStatus","/voyageData/truckLicenseId","/visits"]'
