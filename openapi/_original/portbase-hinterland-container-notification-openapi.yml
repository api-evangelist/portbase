          - road
          - rail
          - barge
          - cer
          - sea
        sealNumberAllowed:
          type: boolean
          description: Is the seal number required.
        reeferAllowed:
          type: boolean
          description: Is reefer information required.
        grossWeightAllowed:
          type: boolean
          description: Is gross weight required.
        outOfGaugeAllowed:
          type: boolean
          description: Is out of gauge required.
        dangerousGoodsAllowed:
          type: boolean
          description: Is dangerous goods information required.
        cargoCutOffInMinutes:
          type: integer
          description: The minimum amount of time (in minutes) before visit arrival when operators are still allowed to submit changes to the cargo list.
          format: int32
          nullable: true
        lossenOpRichtlijnAllowed:
          type: boolean
          description: Are equipment numbers optional for empty discharge handlings.
      description: Contains restrictions on handling declarations, depending on the type of declaration.
    TransportOrder:
      type: object
