        shipName:
          type: string
          nullable: true
        imoCode:
          type: string
          nullable: true
        crnNumber:
          type: string
          nullable: true
        voyageNumber:
          type: string
          nullable: true
        eta:
          type: string
          description: ETA given by the terminal
          format: date-time
          nullable: true
        etd:
          type: string
          description: ETD given by the terminal
          format: date-time
          nullable: true
        expectedDischargeTime:
          type: string
          format: date-time
          nullable: true
