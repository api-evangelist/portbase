          nullable: true
        dropoffStatus:
          title: ''
          type: ''
          description: Known terminal status for the dropoff of the shipped cargo.
          nullable: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/ContainerStatus'
        dropoffReference:
          type: string
          description: Known reference to identify the dropoff of the shipped cargo.
          nullable: true
        releaseExpiration:
          type: string
          description: Expiration for the commercial release.
          format: date-time
          nullable: true
        releaseReference:
          type: string
