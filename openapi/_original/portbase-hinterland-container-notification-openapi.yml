      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bollard'
  /listen:
    post:
      tags:
      - Tracking API
      summary: Listen to voyage and detachedHandling updates
      description: 'Listen in real-time to voyage and detachedHandling updates.


        Read the above section describing working of the [Tracking API](#tag/Tracking-API) carefully.'
      operationId: _01_listen
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetHinterlandUpdates'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HinterlandUpdateBatch'
  /integralPlanning/voyage:
    post:
      tags:
      - Integral Planning API
      summary: Update voyage planning
      description: This endpoint can be used to update an integrally planned voyage.
      operationId: _01_planVoyage
      requestBody:
        content:
          application/json:
