        number between delivery order and physical container</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLP</td><td>Blocked by police</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>BLT</td><td>Blocked by terminal</td><td>BLOCKED</td><td>Loading / Discharge</td></tr><tr><td>CDM</td><td>Customs documents missing</td><td>CUSTOMS_DOCUMENT</td><td>Loading / Discharge</td></tr><tr><td>COA</td><td>Container not available</td><td>AVAILABLE</td><td>Loading</td></tr><tr><td>BCO</td><td>Before cargo opening</td><td>CARGO_OPENING</td><td>Discharge</td></tr><tr><td>COR</td><td>Container not released<br>Booking status</td><td>COMMERCIAL_RELEASE</td><td>Loading</td></tr><tr><td>BON</td><td>Size/type</td><td>SIZETYPE_APPROVED</td><td>Loading / Discharge</td></tr><tr><td>ORN</td><td>Booking number unknown<br>Carrier/container lessor unknown</td><td>BOOKING_APPROVED</td><td>Discharge</td></tr><tr><td>QQQ</td><td>Conditionally accepted (all statuses unknown)</td><td>null</td><td>Loading
