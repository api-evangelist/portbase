        classification:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/GoodsClassification'
        grossWeight:
          type: number
          description: The gross weight of the cargo in kilograms, including package weight, excluding container weight.
          nullable: true
        numberOfPackages:
          type: integer
          format: int32
          nullable: true
        packageType:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CargoPackageType'
        minimumTemperature:
          type: number
          description: The minimum temperature (degrees C) on which the cooling system must be set.
          nullable: true
        maximumTemperature:
          type: number
          description: The maximum temperature (degrees C) on which the cooling system must be set.
          nullable: true
        unCode:
          type: string
          description: The UN code of the container good
          nullable: true
          example: '150'
        hazardClass:
          type: string
          description: The IMO hazard class of the container good
          nullable: true
          example: '1'
        subsidiaryRisk:
