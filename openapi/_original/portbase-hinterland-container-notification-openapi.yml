        subsidiaryRisk:
          type: string
          description: Any risks in addition to the class to which dangerous goods are assigned; and which is determined by a requirement to have a subsidiary risk.
          nullable: true
        emsFireCode:
          type: string
          description: The code of the emergency response procedure for vessels carrying dangerous goods in case of fire
          nullable: true
        emsSpillageCode:
          type: string
          description: The code of the emergency response procedures for vessels carrying dangerous goods in case of spillage
          nullable: true
        properties:
          type: string
          description: Extra information about the container good
          nullable: true
        segregationGroup:
          type: string
          description: The segregation group of the container good
          nullable: true
        packingGroup:
          type: string
