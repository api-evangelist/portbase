components:
  schemas:
    GetBarges:
      type: object
      properties:
        term:
          type:
          - string
          - 'null'
          description: Optional. Filters barges by name or ENI number (European Number of Identification). The search is case-insensitive and matches on the start of a word. Leave empty to retrieve all barges (up to 10,000).
      description: Retrieve barges, optionally filtered by a search term. Results are sorted by name and capped at 10,000 entries.
    GetTerminalByCode:
      required:
      - code
      type: object
      properties:
        code:
          type: string
        modality:
          type:
          - string
          - 'null'
          enum:
          - road
          - rail
          - barge
          - cer
          - sea
    TimetableEntry:
      required:
      - code
      - declarant
      - id
      - startDate
      - terminal
      - totalDischarge
      - totalLoading
      - window
      type: object
      properties:
        id:
          type: string
          description: The unique code that identifies the timetable entry for the declarant and terminal.
          readOnly: true
        code:
          type: string
          description: The business code used by the declarant and terminal to identify this timetable entry.
        terminal:
          title: ''
          type: ''
          description: The terminal for this timetable entry.
          readOnly: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/TerminalOrganisation'
        declarant:
          title: ''
          type: ''
          description: The declarant for which this timetable entry is used.
          readOnly: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/DeclarantOrganisation'
        window:
          title: ''
          type: ''
          description: ''
          readOnly: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/DayAndTimeRange'
        operations:
          title: ''
          type:
          - ''
          - 'null'
          description: ''
          readOnly: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/DayAndTimeRange'
        startDate:
          type: string
          description: The start date on which this timetable entry becomes active. Of all timetable entries with an identical code and of the same declarant for a specific terminal, the one with the most recent start date is the active timetable entry.
          format: partial-date
          readOnly: true
        terminated:
          type: boolean
          description: Indicates that this timetable entry is no longer active since the startDate. A timetable entry with a later startDate can make the slot active again starting on the this new startDate.
          readOnly: true
        totalDischarge:
          type: integer
          description: The number of discharge handlings agreed upon for this timetable entry.
          format: int32
          readOnly: true
        totalLoading:
          type: integer
          description: The number of loading handlings agreed upon for this timetable entry.
          format: int32
          readOnly: true
      description: Recurring appointment for a rail visit
    FindLocations:
      required:
      - term
      type: object
      properties:
        term:
          type: string
          description: Search with this keyword in the fields below to find the needed item(s). The search query is not case sensitive.
    GetRailInterTerminal:
      type: object
      properties:
        shortName:
          type:
          - string
          - 'null'
          description: Code issued by Portbase to identify the organisation.
        interTerminalCode:
          type:
          - string
          - 'null'
          description: Inter terminal specific code, recognised by the terminals.
        bicsCode:
          type:
          - string
          - 'null'
          description: Terminal code according to the Terminal code table of Binnenvaart Informatie- en Communicatie Systeem managed by Rijkswaterstaat.
          example: 00DDE
      description: Terminal query. Only one field required
    GetBargeAccessPoints:
      required:
      - portUnCode
      type: object
      properties:
        portUnCode:
          type: string
          description: UN/LOCODE where the port is located; the United Nations Code for Trade and Transport Locations of this location.
    FixedWindow:
      required:
      - code
      - declarant
      - handlings
      - id
      - periodOfValidity
      - terminal
      - window
      type: object
      properties:
        id:
          type: string
          description: The unique code that identifies the fixed window for the declarant and terminal.
          readOnly: true
        code:
          type: string
          description: The business code used by the declarant and terminal to identify this fixed window.
        terminal:
          title: ''
          type: ''
          description: The terminal for this fixed window.
          readOnly: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/TerminalOrganisation'
        declarant:
          title: ''
          type: ''
          description: The declarant for which this fixedwindow is used.
          readOnly: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/DeclarantOrganisation'
        window:
          title: ''
          type: ''
          description: ''
          readOnly: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/DayAndTimeRange'
        periodOfValidity:
          title: ''
          type: ''
          description: ''
          readOnly: true
          deprecated: false
          allOf:
          - $ref: '#/components/schemas/DateRange'
        handlings:
          type: integer
          description: The number of handlings agreed upon for this fixed window.
          format: int32
          readOnly: true
        minimumCallSize:
          type:
          - integer
          - 'null'
          description: The minimum number of handlings allowed for this fixed window.
          format: int32
          readOnly: true
      description: '`Integral planning` Declarant can indicate to the terminal that they use one of their fixed windows.'
    HinterlandOrganisation:
      required:
      - fullName
      - shortName
      type: object
      properties:
        fullName:
          type: string
          description: The full name of the organisation
        shortName:
          type: string
          description: The short name of the organisation
        emailAddress:
          type:
          - string
          - 'null'
          description: The email address of the organisation
        address:
          type:
          - string
          - 'null'
          description: The address of the organisation
        city:
          type:
          - string
          - 'null'
          description: The city where the organisation is located
        countryUnCode:
          type:
          - string
          - 'null'
          description: The UN code of the country where the organisation is located
        countryName:
          type:
          - string
          - 'null'
          description: The name of the country where the organisation is located
        zipCode:
          type:
          - string
          - 'null'
          description: The zip code of the organisation
        phoneNumber:
          type:
          - string
          - 'null'
          description: The phone number of the organisation
        faxNumber:
          type:
          - string
          - 'null'
          description: The fax number of the organisation
        contact:
          type:
          - string
          - 'null'
          description: The contact person of the organisation
        customsEORINumber:
          type:
          - string
          - 'null'
          description: The EORI number of the organisation, issued by customs
        ean:
          type:
          - string
          - 'null'
          description: The EAN code of the organisation
        chamberOfCommerceNumber:
          type:
          - string
          - 'null'
          description: The chamber of commerce number of the organisation
        scacCode:
          type:
          - string
          - 'null'
          description: The SCAC code of the organisation
      description: Party that will receive the commercial release.
    DeclarantOrganisation:
      required:
      - ean
      - fullName
      - shortName
      type: object
      properties:
        fullName:
          type: string
          description: The full name of the organisation
        ean:
          type: string
          description: The EAN code of the organisation
        shortName:
          type: string
          description: Code issued by Portbase to identify the Declarant organisation.
      description: The declarant for which this timetable entry is used.
      readOnly: true
    FindInlandOperators:
      required:
      - term
      type: object
      properties:
        term:
          type: string
        modality:
          type:
          - string
          - 'null'
          enum:
          - road
          - rail
          - barge
          - cer
          - sea
    GetFixedWindowsForDeclarant:
      type: object
      properties:
        terminalShortName:
          type:
          - string
          - 'null'
          description: '`Deprecated` Use field `terminal` instead.'
        terminal:
          allOf:
          - $ref: '#/components/schemas/Terminal'
        periodOfValidity:
          allOf:
          - $ref: '#/components/schemas/DateTimeRange'
    Terminal:
      required:
      - allowedModalities
      - bicsCode
      - location
      - quayName
      - shortName
      - terminalSettings
      type: object
      properties:
        shortName:
          type: string
          description: Code issued by Portbase to identify the Terminal organisation.
        ean:
          type:
          - string
          - 'null'
          description: European Article Numbering issued by Secure Logistics to identify the Terminal organisation.
        bicsCode:
          type: string
          description: Terminal code according to the Terminal code table of Binnenvaart Informatie- en Communicatie Systeem managed by Rijkswaterstaat.
          example: 00DDE
        quayName:
          type: string
          description: The name of the quay where a vessel can moor for loading, unloading or e.g. awaiting orders.
          example: DDE
        smdgCode:
          type:
          - string
          - 'null'
          description: Terminal facility code according to the Shipplanning Message Development Group.
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
        displayNameOverrides:
          title: ''
          type: ''
          description: Quay name override per modality
          deprecated: false
          allOf:
          - type: object
            additionalProperties:
              type:
              - string
              - 'null'
              description: Quay name override per modality
            description: Quay name override per modality
        requiredDataAuthorisations:
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - deepSeaEta
            - cargoOpening
            - expectedDischargeTime
        allowedModalities:
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        tarRequired:
          type: boolean
          description: Only relevant for road. Indicates whether the terminal uses TAR codes or not.
        roadStatusRequestAllowed:
          type: boolean
          description: Only relevant for road. Indicates whether the terminal can process road status requests.
        bargeStatusRequestForbidden:
          type: boolean
          description: Only relevant for barge. Indicates whether the terminal can process barge status requests. Default is false.
        cutoffPeriod:
          type:
          - string
          - 'null'
          description: Only relevant for rail. Indicates the cutoff period for the train composition upload (relative to the eta) for this terminal.
          format: duration
        loadDischargeListSettings:
          allOf:
          - $ref: '#/components/schemas/LoadDischargeListSettings'
        quaySelectByDeclarantForbidden:
          type: boolean
          description: Indicates whether the terminal can be used by the Declarant to send a visit declaration. Some terminals can only be selected by the terminal organisation or Nextlogic, if so this option is set to true.
        updateAllowed:
          type: boolean
          description: Indicates whether the terminal allows updates on pre-notifications, only for *barge*. Status requests can always be updated. Deprecated, use the handlingUpdateForbidden setting to see for which modality updates are forbidden
          deprecated: true
        handlingUpdateForbidden:
          type: array
          description: Indicates whether the terminal does not support updates on pre-notifications. When this list contains a modality, updates are not supported for this terminal for that modality only. Status requests can always be updated.
          items:
            type:
            - string
            - 'null'
            description: Indicates whether the terminal does not support updates on pre-notifications. When this list contains a modality, updates are not supported for this terminal for that modality only. Status requests can always be updated.
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        handlingUpdateBypassAllowed:
          type: array
          description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass whereby a handling is first cancelled at the terminal and then declared as a new pre-notification.
          items:
            type:
            - string
            - 'null'
            description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass whereby a handling is first cancelled at the terminal and then declared as a new pre-notification.
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        handlingMoveBypassAllowed:
          type: array
          description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass for MoveHandlings only. Update bypass means that a handling is first cancelled at the terminal and then declared as a new pre-notification.
          items:
            type:
            - string
            - 'null'
            description: Indicates whether the terminal does not support standard updates on pre-notifications, but allows the update bypass for MoveHandlings only. Update bypass means that a handling is first cancelled at the terminal and then declared as a new pre-notification.
            enum:
            - road
            - rail
            - barge
            - cer
            - sea
        maxSealNumberLength:
          type:
          - integer
          - 'null'
          description: Maximum length of the seal number.
          format: int32
        acceptAfterRejectForbidden:
          type: boolean
          description: Indicates whether the terminal does not allow a handling accept after a handling reject.
        terminalSettings:
          type: array
          description: Terminal settings restricting handling declarations depending on the type of declaration.
          items:
            $ref: '#/components/schemas/TerminalSettings'
        nextlogicParticipant:
          type: boolean
          description: Setting that indicates this terminal is a Nextlogic Integral Planning participant.
        prenotificationRestrictedToDeclarants:
          title: ''
          type: ''
          description: List of declarants per modality for which declaration declaring handlings is allowed. When there is no list for a modality all declarants are allowed, otherwise it is restricted to this list of declarant shortnames.
          deprecated: false
          allOf:
          - type: object
            additionalProperties:
