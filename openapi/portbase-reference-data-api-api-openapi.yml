openapi: 3.2.0
info:
  title: Portbase Reference Data API
  x-logo:
    url: Portbase_WB_RGB.png
    altText: Portbase logo
  version: '1.0'
  description: 'Operations tagged Reference Data API across 4 of this provider''s published API definitions: portbase-hinterland-container-notification-v2.json, portbase-portvisit-v6.json, portbase-hinterland-container-notification-openapi.yml, portbase-vessel-visit-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.portbase.com/hcn
  description: Production server
- url: https://api.kt.portbase.com/hcn
  description: Test server
- url: https://api.portbase.com/portvisit
  description: Production server
- url: https://api.kt.portbase.com/portvisit
  description: Acceptance server
- url: https://api.sc.portbase.com/portvisit
  description: Test server
tags:
- name: Reference Data API
  description: Portbase uses reference data within the API calls for instance barges, shipping companies, container sizetypes etc. With this Reference Data API you can retrieve the data to be used in the API calls for voyages, visits and handlings. This way you make sure you do not send unknown or invalid information.
paths:
  /refdata/findShippingCompanies:
    post:
      tags:
      - Reference Data API
      summary: Find shipping companies
      description: Endpoint used to find shipping companies/carriers for the incoming or outgoing visit.
      operationId: _01_findShippingCompanies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindShippingCompanies'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingCompany'
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /refdata/getShippingCompany:
    post:
      tags:
      - Reference Data API
      summary: Get shipping company
      description: Endpoint used to get a specific shipping company/carrier for the incoming or outgoing visit.Only one field required.
      operationId: _02_getShippingCompany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetShippingCompany'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingCompany'
        '204':
          description: No shipping company found
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /refdata/getShippingCompanies:
    post:
      tags:
