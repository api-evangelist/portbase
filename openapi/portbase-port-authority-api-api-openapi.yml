      summary: Add berth visit
      description: Inserts a berth visit after the given berth visit or at the start if no berthVisitId is given.
      operationId: addBerthVisitAfter
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.adapter.ApiProcessAddBerthVisitAfter'
      responses:
        '200':
          description: successful operation, returns the id of the berth visit that was inserted.
          content:
            application/json:
              schema:
                type: string
