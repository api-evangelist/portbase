components:
  schemas:
    com.portbase.bezoekschip.adapter.ApiProcessAddBerthVisitAfter:
      title: ProcessAddBerthVisitAfter
      required:
      - berthCode
      - crn
      type: object
      properties:
        crn:
          minLength: 1
          type: string
          description: The call reference number of the visit
        berthVisitId:
          type:
          - string
          - 'null'
          description: The ID of the berth visit after which the new berth visit should be inserted, or null to insert a berth visit at port arrival
        berthCode:
          type: string
          description: The berth code
        accept:
          type: boolean
          description: Set this to also accept the visit
    com.portbase.bezoekschip.adapter.ApiProcessAtd:
      title: ProcessAtd
      required:
      - berthCode
      - crn
      - timestamp
      type: object
      properties:
        crn:
          minLength: 1
          type: string
          description: The call reference number of the visit
        berthCode:
          type: string
          description: The berth code
        timestamp:
          type: string
          description: The time of departure of the vessel from the berth
          format: date-time
        lastBerth:
          type: boolean
          description: Flag that indicates whether or not this is the last berth on the visit
    com.portbase.bezoekschip.adapter.ApiProcessAta:
      title: ProcessAta
      required:
      - berthCode
      - crn
      - timestamp
      type: object
      properties:
        crn:
          minLength: 1
          type: string
          description: The call reference number of the visit
        berthCode:
          type: string
          description: The berth code
        timestamp:
          type: string
          description: The time of arrival of the vessel at the berth
          format: date-time
    com.portbase.bezoekschip.adapter.ApiRejectDeclaration:
      title: RejectDeclaration
      required:
      - crn
      type: object
      properties:
        crn:
          minLength: 1
          type: string
          description: The call reference number of the visit
        reason:
          type:
          - string
          - 'null'
          description: The reason for rejection
    com.portbase.bezoekschip.adapter.ApiAcceptDeclaration:
      title: AcceptDeclaration
      required:
      - crn
      type: object
      properties:
        crn:
          minLength: 1
          type: string
          description: The call reference number of the visit
    com.portbase.bezoekschip.common.api.messaging.DeclarationResponse:
      title: DeclarationResponse
      required:
      - accepted
      - crn
      - declarationId
      - declarationType
      type: object
      properties:
        accepted:
          type: boolean
        rejectionReason:
          type:
          - string
          - 'null'
        crn:
          minLength: 1
          type: string
        declarationId:
          minLength: 1
          type: string
        declarationType:
          type: string
    com.portbase.bezoekschip.adapter.ApiRegisterActualTime:
      title: RegisterActualTime
      required:
      - berthVisitId
      - crn
      - timestamp
      type: object
      properties:
        crn:
          minLength: 1
          type: string
          description: The call reference number of the visit
        berthVisitId:
          type: string
          description: The berth visit ID
        timestamp:
          type: string
          description: The actual time of arrival or the actual time of departure of the vessel at the berth
          format: date-time
    com.portbase.bezoekschip.adapter.ApiRegisterAtdPort:
      title: RegisterAtdPort
      required:
      - atdPort
      - crn
      type: object
      properties:
        crn:
          minLength: 1
          type: string
          description: The call reference number of the visit
        atdPort:
          type: string
          format: date-time
    com.portbase.bezoekschip.adapter.ApiChangeBerthVisitLocation:
      title: ChangeBerthVisitLocation
      required:
      - berthCode
      - berthVisitId
      - crn
      type: object
      properties:
        crn:
          minLength: 1
          type: string
          description: The call reference number of the visit
        berthVisitId:
          type: string
          description: The berth visit ID
        berthCode:
          type: string
          description: The berth code of the new location for this berth visit
