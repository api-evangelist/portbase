openapi: 3.2.0
info:
  title: Portbase Road API V1 API
  version: '2.0'
  contact:
    name: Portbase hinterland team
    url: https://hcn.pcs.portbase.com
    email: hinterland@portbase.com
  x-logo:
    url: Portbase_WB_RGB.png
    altText: Portbase logo
  description: 'Operations tagged Road API V1 across 2 of this provider''s published API definitions: portbase-hinterland-container-notification-v2.json, portbase-hinterland-container-notification-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.portbase.com/hcn
  description: Production server
- url: https://api.kt.portbase.com/hcn
  description: Test server
tags:
- name: Road API V1
  description: Deprecated Road API. Please upgrade to Operator API endpoints.
paths:
  /roadvisits:
    post:
      tags:
      - Road API V1
      summary: Create visit
      description: Creates new Visit. Replaced by Operator API endpoints
      operationId: _01_createVisit_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadVisitRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitCreateResultDTO'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /roadvisits/{visitUuid}:
    get:
      tags:
      - Road API V1
      summary: Get roadvisit by visitUuid
      description: Get roadvisit by visitUuid. Replaced by Operator API endpoints
      operationId: _04_getVisitByUuid
      parameters:
      - name: visitUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadVisitResultResult'
      deprecated: true
    delete:
      tags:
      - Road API V1
      summary: Delete roadvisit
      description: Deletes a roadVisit. Replaced by Operator API endpoints
      operationId: _05_deleteRoadVisit
      parameters:
      - name: visitUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeEmpty'
      deprecated: true
    patch:
      tags:
      - Road API V1
      summary: Update visit eta
      description: Update the eta of a roadVisit. Replaced by Operator API endpoints
      operationId: _02_updateRoadVisitEta
      parameters:
      - name: visitUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVisitEtaRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /roadvisits/{visitUuid}/equipments:
    get:
      tags:
      - Road API V1
      summary: Find attached equipments
      description: Find Equipments attached to the specified visit. Replaced by Operator API endpoints
      operationId: _03_getRoadVisitEquipments
      parameters:
      - name: visitUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerListItem'
      deprecated: true
    patch:
      tags:
      - Road API V1
      summary: Update attached equipments
      description: Update the equipments attached to the specified visit. Replaced by Operator API endpoints
      operationId: _06_updateRoadVisitEquipments
      parameters:
      - name: visitUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDetachEquipments'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeEmpty'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /equipments:
    post:
      tags:
      - Road API V1
      summary: Create equipment
      description: Creates an Equipment. Replaced by Operator API endpoints
      operationId: _11_createEquipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentCreateRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCreateResult'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /equipments/{equipmentUuid}:
    get:
      tags:
      - Road API V1
      summary: Get equipment
      description: Get Equipment by uuid. Replaced by Operator API endpoints
      operationId: _13_getEquipmentByUuid
      parameters:
      - name: equipmentUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentWebResult'
      deprecated: true
    put:
      tags:
      - Road API V1
      summary: Replace equipment
      description: Replaces an Equipment. Replaced by Operator API endpoints
      operationId: _12_replaceEquipment
      parameters:
      - name: equipmentUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentUpdateRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCreateResult'
      deprecated: true
    delete:
      tags:
      - Road API V1
      summary: Delete equipment
      description: Deletes an Equipment. Replaced by Operator API endpoints
      operationId: _14_deleteEquipment
      parameters:
      - name: equipmentUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /bookings:
    post:
      tags:
      - Road API V1
      summary: Create booking
      description: Creates a Booking. Replaced by Operator API endpoints.
      operationId: _21_createBooking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCreateResult'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /bookings/{bookingUuid}:
    put:
      tags:
      - Road API V1
      summary: Replace booking
      description: Replaces a Booking. Replaced by Operator API endpoints.
      operationId: _22_replaceBooking
      parameters:
      - name: bookingUuid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '200':
          description: successful operation
      deprecated: true
    delete:
      tags:
      - Road API V1
      summary: Delete booking
      description: Deletes a Booking. Replaced by Operator API endpoints.
      operationId: _23_deleteBooking
      parameters:
      - name: bookingUuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /preferences/notification:
    get:
      tags:
      - Road API V1
      summary: Get terminal notification preferences
      description: Get terminal notification preferences by params. Replaced by Operator API endpoints
      operationId: _31_getNotificationPreferenceByParams
      parameters:
      - name: terminalEAN
        in: query
        schema:
          type: string
      - name: modality
        in: query
        schema:
          type: string
          deprecated: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /preferences/organisation:
    get:
      tags:
      - Road API V1
      summary: Get organisation preferences
      description: Get organisation preferences by params. Replaced by Operator API endpoints
      operationId: _32_getOrganisationPreferencesByParams
      parameters:
      - name: terminalEAN
        in: query
        schema:
          type: string
      - name: organisationShortName
        in: query
        schema:
          type: string
      - name: modality
        in: query
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganisationPreference'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
  /quaymodalities:
    get:
      tags:
      - Road API V1
      summary: Get quay modalities
      description: Get quay modalities. Replaced by Operator API endpoints
      operationId: _40_getQuayModalities
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuayModalitySelectItemDTO'
      deprecated: true
    servers:
    - url: https://api.portbase.com/hcn
      description: Production server
    - url: https://api.kt.portbase.com/hcn
      description: Test server
components:
  schemas:
    ResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        result:
          allOf:
          - type: object
    NotificationStatusBase:
      type: object
      properties:
        state:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an..50 |

            |**Occurrence**| 0..1 |

            |**Description**| EAN number of charter party that will execute the physical transport |

            |**Possible values**|''NEW'' = Not Sent|

            ||''DECLARED'' = Sent|

            ||''ACCEPTED'' = Accepted by terminal|

            ||''REJECTED'' = Rejected by terminal|

            ||''UPDATED'' = Updated|

            ||''CANCEL_SEND'' = Cancelled|

            '
        stateReasons:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/Remarks'
      description: Notification status resource representation
    RoadVisitRequest:
      type: object
      properties:
        expectedArrivalDateTime:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| datetime |

            |**Occurrence**| 0..1 |

            |**Format**| ISO datetime, YYYY-MM-DDThh:mm:ss+TZD |

            |**Description**| Expected arrival date / time (ETA) |

            '
          format: date-time
        terminal:
          allOf:
          - $ref: '#/components/schemas/TerminalRequest'
      description: RoadVisit representation
    EquipmentCreateResult:
      required:
      - equipmentUuid
      type: object
      properties:
        equipmentUuid:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an..32 |

            |**Occurrence**| 1..1 |

            |**Description**| Universal Unique Identifier for the equipment as generated by the PCS |

            '
    EquipmentStatusListItem:
      type: object
      properties:
        aggregatedStatus:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Container status |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - O, N, U,
        available:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Available status |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK, NA = Not Applicable, NS = Not Supported |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - U, O, N, NA, NS
        bookingApproved:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Booking approved status (*deprecated*) |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK, NA = Not Applicable, NS = Not Supported |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - U, O, N, NA, NS
        bookingPresent:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Booking present status |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK, NA = Not Applicable, NS = Not Supported |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - U, O, N, NA, NS
        commercialRelease:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Commercial release status |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK, NA = Not Applicable, NS = Not Supported |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - U, O, N, NA, NS
        customsDocument:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Customs document status |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK, NA = Not Applicable, NS = Not Supported |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - U, O, N, NA, NS
        sizeTypeApproved:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Size type approved status |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK, NA = Not Applicable, NS = Not Supported |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - U, O, N, NA, NS
        customsRelease:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Blocked status |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK, NA = Not Applicable, NS = Not Supported, IB = Is Blocked, NB = Not Blocked |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - U, O, N, NA, NS, IB, NB
        cargoOpening:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an2 |

            |**Occurrence**| 1..1 |

            |**Description**| Cargo opening status |

            |**Possible values:**| U = Unknown, O = OK, N = Not OK, NA = Not Applicable, NS = Not Supported |

            '
          enum:
          - N
          - O
          - U
          - NA
          - NS
          - IB
          - NB
          - U, O, N, NA, NS
    VisitListItem:
      type: object
      properties:
        visitId:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an..12 |

            |**Occurrence**| 0..1 |

            |**Description**| Barge Call ID, Terminal Voyage Number (treknumber) or TAR (Truck Appointment Reference) |

            '
        visitUuid:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an..32 |

            |**Occurrence**| 1..1 |

            |**Description**| Universal Unique Identifier for the visit as generated by the PCS |

            '
        modality:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n1 |

            |**Occurrence**| 1..1 |

            |**Description**| Modality |

            |**Possible values:**| 2 = Rail, 3 = Road, 8 = Barge |

            '
          enum:
          - 2,3,8
        handlingTimeActual:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| datetime |

            |**Occurrence**| 0..1 |

            |**Format**| YYYY-MM-DDThh:mm:ss+TZD |

            |**Description**| Actual handling (loading or discharge) date/time , ISO datetime  |

            '
          format: date-time
        timeSlotStartDateTime:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| datetime |

            |**Occurrence**| 0..1 |

            |**Format**| YYYY-MM-DDThh:mm:ss+TZD |

            |**Description**| Timeslot end date/time as issued by the terminal, ISO datetime  |

            '
          format: date-time
        timeSlotEndDateTime:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| datetime |

            |**Occurrence**| 0..1 |

            |**Format**| YYYY-MM-DDThh:mm:ss+TZD |

            |**Description**| Timeslot start date/time as issued by the terminal, ISO datetime  |

            '
          format: date-time
        truckLicenseId:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an..17 |

            |**Occurrence**| 0..1 |

            |**Description**| Truck license ID |

            '
        expectedArrivalDateTime:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| datetime |

            |**Occurrence**| 0..1 |

            |**Format**| YYYY-MM-DDThh:mm:ss+TZD |

            |**Description**| Expected arrival date/time (ETA), ISO datetime  |

            '
          format: date-time
        terminalDisplayName:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an..200 |

            |**Occurrence**| 1..1 |

            |**Description**| Terminal display name |

            '
        terminalShortName:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an..35 |

            |**Occurrence**| 0..1 |

            |**Description**| Terminal short name |

            '
      description: Container list item representation
    HandlingResultDto:
      type: object
      properties:
        offDimensionsFront:
          type:
          - integer
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n4,0 |

            |**Occurrence**| 0..1 |

            |**Description**| Off dimensions front - Dimensions in Centimeter |

            |**Format**| 4 numbers no decimals |

            '
          format: int32
        offDimensionsHeight:
          type:
          - integer
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n4,0 |

            |**Occurrence**| 0..1 |

            |**Description**| Off dimensions height - Dimensions in Centimeter |

            |**Format**| 4 numbers no decimals |

            '
          format: int32
        offDimensionsLeft:
          type:
          - integer
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n4,0 |

            |**Occurrence**| 0..1 |

            |**Description**| Off dimensions left - Dimensions in Centimeter |

            |**Format**| 4 numbers no decimals |

            '
          format: int32
        offDimensionsRear:
          type:
          - integer
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n4,0 |

            |**Occurrence**| 0..1 |

            |**Description**| Off dimensions rear - Dimensions in Centimeter |

            |**Format**| 4 numbers no decimals |

            '
          format: int32
        offDimensionsRight:
          type:
          - integer
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n4,0 |

            |**Occurrence**| 0..1 |

            |**Description**| Off dimensions right - Dimensions in Centimeter |

            |**Format**| 4 numbers no decimals |

            '
          format: int32
        temperatureMaximum:
          type:
          - number
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n3,1 |

            |**Occurrence**| 0..1 |

            |**Description**| Maximum temperature in degrees Celsius |

            |**Format**| 999 max 1 decimal |

            '
        temperatureMinimum:
          type:
          - number
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n3,1 |

            |**Occurrence**| 0..1 |

            |**Description**| Minimum temperature in degrees Celsius |

            |**Format**| 999 max 1 decimal |

            '
        temperatureSetting:
          type:
          - number
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| n3,1 |

            |**Occurrence**| 0..1 |

            |**Description**| Temperature setting in degrees Celsius |

            |**Format**| 999 max 1 decimal |

            '
      description: '| | |

        |----|----|

        |**Occurrence**| 0..1 |

        |**Description**| Handling representation |

        '
    CarrierRequest:
      type: object
      properties:
        scacCode:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an4 |

            |**Occurrence**| 0..1 |

            |**Cardinality**| Conditional |

            |**Description**| Carrier SCAC Code |

            |**Validation**|R245 - C-SMDG or SCAC code must be present |

            ||R031 - V-valid SCAC or SMDG |

            ||R043 - V-for POST duplicate check |

            '
        smdgCode:
          type:
          - string
          - 'null'
          description: '| | |

            |----|----|

            |**Length**| an3 |

            |**Occurrence**| 0..1 |

            |**Cardinality**| Conditional |

            |**Description**| Carrier SMDG Code |

            |**Validation**|R245 - C-SMDG or SCAC code must be present |

            ||R031 - V-valid SCAC or SMDG |

            ||R043 - V-for POST duplicate check |

            '
      description: 'Carrier representation: SCAC code and/or SMDG code'
    ModalitySelectItemDTO:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    TerminalResult:
      type: object
      properties:
        bicsCode:
          type:
          - string
