          - 'null'
          description: "    Used in the Temporary storage declaration (TS) to Dutch customs\n\n    EU_COMMUNITY_GOODS                  C Goods transported as EU Community goods \n\n    EU_COMMUNITY_GOODS_IN_TRANSHIPMENT  N27 EU community goods in transhipment \n\n    EU_EMPTY_RETURN_PACKAGING           NP EU empty return packaging \n\n    EU_PROCEDURE_T                      T EU Customs procedure T (goods transported under T1 and/or T2 documentation) \n\n    EU_PROCEDURE_T1                     T1 EU Customs procedure T1 (goods transported under T1 documentation) \n\n    EU_PROCEDURE_T2                     T2 EU Customs procedure T2 (goods transported under T2 documentation) \n\n    EU_PROCEDURE_T2F                    T2F EU Customs procedure T2F (goods transported under T2 documentation between special fiscal territory and other customs territory, see Article 188 DA EU) \n\n    GOODS_FROM_EVA_COUNTRIES            TV Goods from European Free Trade Association (EFTA) countries\n"
