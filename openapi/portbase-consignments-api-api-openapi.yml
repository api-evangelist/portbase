    com.portbase.bezoekschip.common.api.consignments.enums.TransportConditionCode:
      title: TransportConditionCode
      type: string
      description: "    Used in the Port Community System of Portbase.\n\n    Code for the contractual condition for the transport of the container cargo,\n    indicating whether the carrier is only responsible for the main carriage or also for the pre and/or on-carriage, e.g. door-to-door, pier-to-pier.\n\n        27 Door-to-door : The carrier is responsible for the intermodal carriage of cargo including both the pre-carriage and the on- carriage.\n        28 Door-to-pier : The carrier is responsible for the intermodal carriage of cargo including the pre-carriage, but excluding the on-carriage.\n        29 Pier-to-door : The carrier is responsible for the intermodal carriage of cargo including the on-carriage, but excluding the pre-carriage.\n        30 Pier-to-pier : The carrier of intermodal cargo is only responsible for the main carriage.\n"
      enum:
      - DOOR_TO_DOOR
      - DOOR_TO_PIER
      - PIER_TO_DOOR
      - PIER_TO_PIER
