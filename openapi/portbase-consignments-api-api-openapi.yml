    com.portbase.bezoekschip.common.api.external.consignments.status.ApiPendingNotification:
      title: PendingNotification
      required:
      - notificationTime
      type:
      - object
      - 'null'
      properties:
        notificationTime:
          type: string
          description: 'The time the Shared Trader Interface sent the notification that a filing is still pending.

            '
          format: date-time
      description: 'IE3N11 - Timer to complete the linking of the partial ENS filings has expired. Both carrier and supplementary declarant receive this status message.

        A partial master filing triggers the start of the timer for linking it with the related house level filings. The time allocated for the linking of partial filings should allow sufficient time for the completion of the risk analysis according to the legally set deadlines. Those deadlines depend on the given ENS scenario (i.e. transport mode and situations that determine time-limits – see Articles 105, 106, 107 UCC-DA).

        For ENS filings F10, F11, F12 and F13 the timer is set to 24h upon reception of the ENS filing in cases of Article 105 (a) UCC-DA.

        For ENS filings F10, F11, F12 and F13 the timer is set to 4h upon reception of the ENS filing in cases of Article 105 (b) UCC-DA.

        For ENS filings F10, F11, F12 and F13 the timer is set to 2h upon reception of the ENS filing in cases of Article 105 (c) UCC-DA (edited)

        '
