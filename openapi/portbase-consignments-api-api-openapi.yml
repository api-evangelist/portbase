tags:
- name: Consignments API
  description: This is a API for sending Bill of Ladings.
paths:
  /consignment/straight-bl-single-filing:
    post:
      tags:
      - Consignments API
      summary: Send a straight bill of lading for single filing. (IE3F10)
      description: 'Straight bill of lading is a non-negotiable bill of lading.

        Under this bill of lading, the shipping company will deliver the shipment to its consignee

        on presentation of identification. It is also called consignment bill of lading.

        The bill of lading states that the goods are consigned to a specified person and

        it is not negotiable. A straight bill of lading is a document in which a seller agrees

        to use a specific transportation to ship goods to a certain location, and the bill

        is assigned to a specific party. The straight bill of lading details the type, quality,

        and quantity of the good. It also serves as the receipt upon arrival at the destination.

        Because it is assigned to a specific party, it is not negotiable and may not be

        re-assigned to another party.


        Single filing means that the data is provided in one complete ENS filing where all necessary

        data is available to the party that files. As carrier, you will have to obtain certain

        additional commercial data from the EU established consignee. If the consignee does not

        share the required data, you will need to declare its EORI in your partial ENS (F13)

        and the consignee will become responsible and liable for its partial filing into the ICS2 system.


        For consignments that will be discharged in NL, Portbase will automatically send a

        TSD to Dutch Customs once it has received a MRN from the ICS2 Shared Trader Interface (STI)'
      operationId: c01StraightBillOfLadingSingleFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.StraightBillOfLadingSingleFiling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/master-bl-single-filing:
    post:
      tags:
      - Consignments API
      summary: Send master and house bill of lading for single filing. (IE3F11)
      description: 'A bill of lading (BoL) is a document issued by a carrier (or his agent) to acknowledge

        receipt of cargo for shipment. It is a contractual document between the shipper/consignor

        of goods and the carrier detailing the type, quantity and destination of the goods

        being carried. The bill of lading also serves as a receipt of shipment when

        the goods are delivered at the predetermined destination.


        Single filing means that the data is provided in one complete ENS filing (F11) where all

        necessary data is available to the party that files. As carrier, you will have to obtain the

        necessary data from all underlying house bills of lading from the issuing freight forwarders

        (including express or postal operators issuing equivalent transport documents). The information

        required includes buyer and seller data available to the consignee at the lowest house bill of

        lading. If the freight forwarder does not share the required data, then you will need to

        submit a partial ENS (F12) based on your master bill of lading and declare the EORI of

        the freight forwarder in your filing. The freight forwarder will then become responsible

        for the house level data filing to ICS2 and will have to obtain data from other house bill of

        lading issuing parties or declare in its partial ENS filing the identity of parties still

        required to file.


        For consignments that will be discharged in NL, Portbase will automatically send a

        TSD to Dutch Customs once it has received a MRN from the ICS2 Shared Trader Interface (STI)'
      operationId: c02MasterBillOfLadingSingleFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.BillOfLadingSingleFiling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/master-bl-multiple-filing:
    post:
      tags:
      - Consignments API
      summary: Send a master bill of lading for multiple filing. (IE3F12)
      description: 'A bill of lading is a document issued by a carrier (or his agent) to acknowledge

        receipt of cargo for shipment. It is a contractual document between the shipper/consignor

        of goods and the carrier detailing the type, quantity and destination of the goods

        being carried. The bill of lading also serves as a receipt of shipment when

        the goods are delivered at the predetermined destination.


        Multiple filing means that the data is provided in multiple ENS filings by different parties.

        If the freight forwarder does not share the required data, then as carrier you will need to

        submit a partial ENS (F12) based on your master bill of lading and declare the EORI of the

        freight forwarder in your filing. The freight forwarder will then become responsible for the

        house level data filing to ICS2 and will have to obtain data from other house bill of lading

        issuing parties or declare in its partial ENS filing the identity of parties still required

        to file.


        For consignments that will be discharged in NL, Portbase will automatically send a TSD to Dutch

        Customs once it has received a MRN from the ICS2 Shared Trader Interface (STI)'
      operationId: c03MasterBillOfLadingMultipleFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.BillOfLadingMultipleFiling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/straight-bl-multiple-filing:
    post:
      tags:
      - Consignments API
      summary: Send a straight bill of lading for multiple filing. (IE3F13)
      description: 'Straight bill of lading is a non-negotiable bill of lading.

        Under this bill of lading, the shipping company will deliver the shipment to its consignee

        on presentation of identification. It is also called consignment bill of lading.

        The bill of lading states that the goods are consigned to a specified person and

        it is not negotiable. A straight bill of lading is a document in which a seller agrees

        to use a specific transportation to ship goods to a certain location, and the bill

        is assigned to a specific party. The straight bill of lading details the type, quality,

        and quantity of the good. It also serves as the receipt upon arrival at the destination.

        Because it is assigned to a specific party, it is not negotiable and may not be

        re-assigned to another party.


        Multiple filing means that the data is provided in multiple ENS filings by different parties.

        If the consignee does not share the required data, you will need to declare its EORI in your

        partial ENS (F13) and the consignee will become responsible and liable for its partial filing

        into the ICS2 system.


        For consignments that will be discharged in NL, Portbase will automatically send a TSD to

        Dutch Customs once it has received a MRN from the ICS2 Shared Trader Interface (STI)'
      operationId: c04StraightBillOfLadingMultpleFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.StraightBillOfLadingMultipleFiling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/road-bl:
    post:
      tags:
      - Consignments API
      summary: Send a road bill of lading. (IE3F50)
      description: Road mode of transport.
      operationId: c05MasterBillOfLadingRoadFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.BillOfLadingRoadFiling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/temporary-storage-declaration:
    post:
      tags:
      - Consignments API
      summary: Send an import declaration for usage in a temporary storage declaration to…
      description: 'The "Temporary Storage Declaration" must be lodged for the goods that will be unloaded in a port

        of the Netherlands and will be stored in a facility of temporary storage.'
      operationId: c06temporaryStorageDeclaration
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.TemporaryStorageDeclaration'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/master-bl-no-filing:
    post:
      tags:
      - Consignments API
      summary: Send a master bill of lading without filing to customs
      description: 'A bill of lading is a document issued by a carrier (or his agent) to acknowledge

        receipt of cargo for shipment. It is a contractual document between the shipper/consignor

        of goods and the carrier detailing the type, quantity and destination of the goods

        being carried. The bill of lading also serves as a receipt of shipment when

        the goods are delivered at the predetermined destination.


        For example to be used by carriers that hold a regular shipping service license (RSS).

        For those carriers from december 4th 2024 there is no longer an obligation

        to report Temporary Storage for Union goods.'
      operationId: c08MasterBillOfLadingNoFiling
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.BillOfLadingNoFiling'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/filing-invalidate-request:
    post:
      tags:
      - Consignments API
      summary: Invalidate a previously sent filing
      description: Invalidate a previously sent filing.
      operationId: c09FilingInvalidate
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.FilingInvalidateRequest'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/notification-of-arrival:
    post:
      tags:
      - Consignments API
      summary: Notifies the arrival of the vessel
      description: Notifies the arrival of the vessel.
      operationId: c09NotifyArrival
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.ApiNotificationOfArrival'
      responses:
        '204':
          description: successful operation
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
  /consignment/get-consignment:
    post:
      tags:
      - Consignments API
      summary: Get Consignment Process
      description: 'This endpoint can be used to load a consignment.

        It is mandatory to fill either the functional reference id or the MRN.

        When the functional reference id is used,

        it might be necessary to also fill in the consignment number.

        (for old cases where an SDT has been sent to customs)

        Use the version parameter to get a specific version of the consignment.'
      operationId: getConsignment
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.consignments.queries.GetConsignmentBySomeId'
      responses:
        '200':
          description: The consignment with given functional reference id and consignment number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportConsignment'
    servers:
    - url: https://api.portbase.com/portvisit
      description: Production server
    - url: https://api.kt.portbase.com/portvisit
      description: Acceptance server
    - url: https://api.sc.portbase.com/portvisit
      description: Test server
components:
  schemas:
    com.portbase.bezoekschip.common.api.external.consignments.ApiPackaging:
      title: Packaging
      required:
      - typeOfPackages
      type:
      - object
      - 'null'
      properties:
        typeOfPackages:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiCargoPackageType'
        numberOfPackages:
          maximum: 99999999
          type:
          - integer
          - 'null'
          description: 'The number of packages as self-contained units (packaged in such a way that

            they cannot be divided without first undoing the packing) (edited)


            Except for bulk goods (packageType is ''VQ'', ''VG'', ''VL'', ''VY'', ''VR'', ''VS'', ''VO'', ''NE'', ''NF'', ''NG''), this is required

            '
          format: int32
        shippingMarks:
          type: array
          description: 'List of shipping marks.

            Markings or labels placed on the packaging of goods to provide important information for handling,

            identification, and tracking during shipping and transportation.

            These marks serve various purposes and are typically applied using stencils,

            labels, or printing directly on the packaging material.


            Except for bulk goods (packageType is ''VQ'', ''VG'', ''VL'', ''VY'', ''VR'', ''VS'', ''VO'', ''NE'', ''NF'', ''NG''), this is required

            '
          items:
            type:
            - string
            - 'null'
            description: 'List of shipping marks.

              Markings or labels placed on the packaging of goods to provide important information for handling,

              identification, and tracking during shipping and transportation.

              These marks serve various purposes and are typically applied using stencils,

              labels, or printing directly on the packaging material.


              Except for bulk goods (packageType is ''VQ'', ''VG'', ''VL'', ''VY'', ''VR'', ''VS'', ''VO'', ''NE'', ''NF'', ''NG''), this is required

              '
      description: 'The packaging used to contain and protect individual items or products within a larger package

        '
    com.portbase.bezoekschip.common.api.external.consignments.status.ApiClearanceGoodsItem:
      title: ClearanceGoodsItem
      required:
      - itemNumber
      type:
      - object
      - 'null'
      properties:
        itemNumber:
          type: integer
          format: int32
        remainingWeight:
          minimum: 0
          type:
          - number
          - 'null'
        remainingPackages:
          type:
          - integer
          - 'null'
          format: int32
    com.portbase.bezoekschip.common.api.external.consignments.status.ApiFilingStatusENS:
      title: FilingStatusENS
      required:
      - filingTime
      type:
      - object
      - 'null'
      properties:
        filingTime:
          type: string
          description: 'The time that the ENSfiling was sent to the Shared Trader Interface (STI).

            '
          format: date-time
        ensRegistrationResponse:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.status.ApiEnsFilingRegistration'
        amendmentNotification:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.status.ApiAmendmentNotification'
        ensErrorNotification:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.status.ApiEnsErrorNotification'
        lifecycleValidationErrorNotification:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.status.ApiEnsLifecycleValidationErrorNotification'
      description: 'The filing status of the ENS at the Shared Trader Interface (STI)

        '
    com.portbase.bezoekschip.common.api.external.consignments.transhipments.ApiTranshipment:
      title: Transhipment
      required:
      - cancelled
      - transhipmentDeclarant
      type:
      - object
      - 'null'
      properties:
        cancelled:
          type: boolean
        midStatus:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.transhipments.ApiMidStatus'
        renStatus:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.transhipments.ApiRenStatus'
        mrn:
          type:
          - string
          - 'null'
        transhipmentDeclarant:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiDeclarant'
    com.portbase.bezoekschip.common.api.external.consignments.input.ApiPackagingInput:
      title: PackagingInput
      required:
      - typeOfPackageCode
      type: object
      properties:
        typeOfPackageCode:
          minLength: 1
          type: string
          description: 'Package type as published in UNECE CEFACT Trade Facilitation Recommendation No. 21

            <a href="https://unece.org/trade/uncefact/cl-recommendations" target="_blank">unece.org</a>

            '
        numberOfPackages:
          maximum: 99999999
          type:
          - integer
          - 'null'
          description: 'The number of packages as self-contained units (packaged in such a way that

            they cannot be divided without first undoing the packing) (edited)


            Except for bulk goods (packageType is ''VQ'', ''VG'', ''VL'', ''VY'', ''VR'', ''VS'', ''VO'', ''NE'', ''NF'', ''NG''), this is required

            '
          format: int32
        shippingMarks:
          type: array
          description: 'List of shipping marks.

            Markings or labels placed on the packaging of goods to provide important information for handling,

            identification, and tracking during shipping and transportation.

            These marks serve various purposes and are typically applied using stencils,

            labels, or printing directly on the packaging material.


            Except for bulk goods (packageType is ''VQ'', ''VG'', ''VL'', ''VY'', ''VR'', ''VS'', ''VO'', ''NE'', ''NF'', ''NG''), this is required

            '
          items:
            maxLength: 512
            minLength: 0
            type:
            - string
            - 'null'
            description: 'List of shipping marks.

              Markings or labels placed on the packaging of goods to provide important information for handling,

              identification, and tracking during shipping and transportation.

              These marks serve various purposes and are typically applied using stencils,

              labels, or printing directly on the packaging material.


              Except for bulk goods (packageType is ''VQ'', ''VG'', ''VL'', ''VY'', ''VR'', ''VS'', ''VO'', ''NE'', ''NF'', ''NG''), this is required

              '
      description: 'The packaging used to contain and protect individual items or products within a larger package

        '
    com.portbase.bezoekschip.common.api.external.consignments.input.ApiConsignmentHouseLevelStraightMultipleFiling:
      title: ConsignmentHouseLevelStraightMultipleFiling
      required:
      - consignmentNumber
      - consignor
      - goodsItems
      - placeOfAcceptance
      - placeOfDelivery
      - supplementaryDeclarant
      - transportCharges
      type: object
      properties:
        consignmentNumber:
          maxLength: 70
          minLength: 1
          type: string
          description: The transport document number of the Bill of Lading
        traderAssignedReference:
          maxLength: 35
          minLength: 0
          type:
          - string
          - 'null'
          description: 'This entry concerns the unique commercial reference number assigned by the

            person concerned to the consignment in question.

            It may take the form of WCO (ISO 15459) codes or equialent.

            It provides access to underlying commercial data of interest to customs.

            '
        consignor:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiConsignor'
        consignee:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiConsignee'
        notifyParties:
          type: array
          description: 'The party that is to be notified by the carrier or shipping agent once the shipment arrives

            at its destination or reaches a certain point in transit.

            This notification typically includes information about the arrival of the shipment,

            its status, and any necessary instructions for further handling or delivery.

            '
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiNotifyParty'
        additionalSupplyChainActor:
          maxItems: 99
          minItems: 0
          type: array
          description: " A party in the supply chain having obtained a trusted trader certificate but\n otherwise not being identified in the declarations.\n"
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiAdditionalSupplyChainActor'
        placeOfAcceptance:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiPlaceOfAcceptance'
        placeOfDelivery:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiPlaceOfDelivery'
        transportCharges:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiTransportCharges'
        goodsItems:
          maxItems: 9999
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.ApiGoodsItemENS'
        supportingDocuments:
          maxItems: 99
          minItems: 0
          type: array
          description: Details related to additional documents or certificates produced in support of the declaration.
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiSupportingDocument'
        additionalInformation:
          maxItems: 99
          minItems: 0
          type: array
          description: Special request to government from declarant to take or not to take action.
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiAdditionalInformation'
        supplementaryDeclarant:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiSupplementaryDeclarant'
      description: The bill of lading that covers specific portions of the shipment within the master bill of lading and is issued by a freight forwarder
    com.portbase.bezoekschip.common.api.external.consignments.input.ApiConsignmentHouseLevelTemporaryStorageDeclaration:
      title: ConsignmentHouseLevelTemporaryStorageDeclaration
      required:
      - consignmentNumber
      - consignor
      type: object
      properties:
        consignmentNumber:
          maxLength: 70
          minLength: 1
          type: string
          description: The transport document number of the Bill of Lading
        placeOfAcceptance:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiPlaceOfAcceptance'
        supportingDocuments:
          maxItems: 99
          minItems: 0
          type: array
          description: Details related to additional documents or certificates produced in support of the declaration.
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiSupportingDocument'
        additionalInformation:
          maxItems: 99
          minItems: 0
          type: array
          description: Special request to government from declarant to take or not to take action.
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiAdditionalInformation'
        additionalSupplyChainActor:
          maxItems: 99
          minItems: 0
          type: array
          description: " A party in the supply chain having obtained a trusted trader certificate but\n otherwise not being identified in the declarations.\n"
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiAdditionalSupplyChainActor'
        consignee:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiConsignee'
        consignor:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiConsignor'
        goodsItems:
          maxItems: 9999999
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.input.ApiGoodsItemTemporaryStorage'
        transportCharges:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiTransportCharges'
        placeOfDelivery:
          $ref: '#/components/schemas/com.portbase.bezoekschip.common.api.external.consignments.ApiPlaceOfDelivery'
        notifyParties:
          type: array
          description: 'The party that is to be notified by the carrier or shipping agent once the shipment arrives

            at its destination or reaches a certain point in transit.

            This notification typically includes information about the arrival of the shipment,

            its status, and any necessary instructions for further handling or delivery.

            '
          items:
